<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>玫瑰金圣诞树</title>
<style>
  html, body { margin: 0; height: 100%; background: #07000a; overflow: hidden; }
  body { font-family: -apple-system, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif; color: #ffe9c9; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  canvas.dragging { cursor: grabbing; }

  .title {
    position: fixed; top: max(14px, env(safe-area-inset-top)); left: 0; right: 0;
    text-align: center; pointer-events: none; user-select: none;
    opacity: 0; transform: translateY(-8px); transition: opacity 2.4s ease 1.6s, transform 2.4s ease 1.6s;
  }
  .ready .title { opacity: 1; transform: none; }
  .title h1 {
    margin: 0; font-weight: 400; line-height: 1.15;
    font-family: "Snell Roundhand", "Apple Chancery", "Segoe Script", "Brush Script MT", cursive;
    font-size: clamp(30px, 5vw, 60px);
    background: linear-gradient(100deg, #fff1c4 0%, #ffc94d 32%, #ff7eb6 68%, #ff2a7f 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 16px rgba(255, 60, 140, .45));
    padding: 0 16px 6px;
  }
  .title p {
    margin: 4px 0 0; font-size: clamp(12px, 1.5vw, 15px); letter-spacing: .42em; text-indent: .42em;
    color: rgba(255, 222, 196, .72);
  }

  .bar {
    position: fixed; left: 0; right: 0; bottom: max(20px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    pointer-events: none; user-select: none;
  }
  .hint {
    font-size: 12px; letter-spacing: .18em; color: rgba(255, 214, 190, .55);
    transition: opacity 1.2s ease; text-align: center; padding: 0 16px;
  }
  .hint.gone { opacity: 0; }
  button {
    pointer-events: auto; cursor: pointer;
    font: inherit; font-size: 13px; letter-spacing: .3em; text-indent: .3em;
    color: #ffd98a; background: rgba(255, 42, 127, .08);
    border: 1px solid rgba(255, 201, 77, .45); border-radius: 999px; padding: 10px 26px;
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    transition: background .25s ease, border-color .25s ease, transform .15s ease;
  }
  button:hover { background: rgba(255, 42, 127, .2); border-color: rgba(255, 201, 77, .85); }
  button:active { transform: scale(.96); }
  button:focus-visible { outline: 2px solid #ffc94d; outline-offset: 3px; }

  #fallback {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: 24px; text-align: center; line-height: 1.8; color: #ffd98a;
  }
  #fallback[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div class="title">
  <h1 id="titleText"></h1>
  <p id="subText"></p>
</div>

<div class="bar">
  <div class="hint" id="hint">拖动旋转 · 滚轮或双指缩放 · 双击散开</div>
  <button id="toggle" type="button">散开</button>
</div>

<div id="fallback" hidden>这个浏览器不支持 WebGL2，请换用新版 Chrome、Edge 或 Safari 打开。</div>

<script>
'use strict';

/* =====================================================================
   可以自己改的地方（改完保存，刷新浏览器就能看到）
   ===================================================================== */
const CONFIG = {
  title: 'Merry Christmas',          // 顶部大标题
  subtitle: '愿你的冬天闪闪发光',       // 标题下面的小字，可以改成她的名字

  colors: {                          // 颜色（网页常用的 #十六进制 写法）
    rose:     '#ff2a7f',             // 玫红（主色）
    deepRose: '#d81b60',             // 深玫红
    pink:     '#ff7eb6',             // 浅粉高光
    gold:     '#ffc94d',             // 金色
    paleGold: '#ffe6a3'              // 浅金
  },

  counts: {                          // 粒子数量（电脑卡顿就把数字调小）
    tree: 46000,                     // 树身
    ribbon: 2600,                    // 每条流光丝带
    ornaments: 260,                  // 闪烁的装饰星
    floor: 20000,                    // 地面光尘
    snow: 1600,                      // 雪花
    hearts: 36,                      // 飘起的爱心
    stars: 1400                      // 背景星空
  },

  spinSpeed: 0.16,                   // 树自转速度（0 = 不转）
  lightSpeed: 0.55,                  // 追光绕树一圈的速度
  exposure: 1.0                      // 整体亮度
};

/* ============================ 基础工具 ============================ */
const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, powerPreference: 'high-performance' });
document.getElementById('titleText').textContent = CONFIG.title;
document.getElementById('subText').textContent = CONFIG.subtitle;

if (!gl) {
  document.getElementById('fallback').hidden = false;
  throw new Error('WebGL2 not supported');
}

const rand = Math.random;
const TAU = Math.PI * 2;

// 把 #rrggbb 转成线性空间的 RGB（渲染最后会统一做一次色调映射）
function hex(h) {
  const n = parseInt(h.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(v => Math.pow(v / 255, 2.2));
}
const C = {};
for (const k in CONFIG.colors) C[k] = hex(CONFIG.colors[k]);
const mixc = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const mul = (a, s) => [a[0] * s, a[1] * s, a[2] * s];

/* ============================ 生成粒子 ============================ */
// 每个粒子 13 个数字：位置(3) 散开时的位置(3) 颜色(3) 大小 相位 类型 附加值
const H = 10, BASE = 0.9, RADIUS = 3.7, TIERS = 5, STAR_Y = H + 0.6;
const data = [];

function add(x, y, z, col, size, type, u) {
  // 散开位置：以树为中心的大球体里随机一点
  const r = 9 + Math.cbrt(rand()) * 12, a = rand() * TAU, c = rand() * 2 - 1, s = Math.sqrt(1 - c * c);
  data.push(x, y, z, Math.cos(a) * s * r, 5 + c * r * 0.75, Math.sin(a) * s * r,
            col[0], col[1], col[2], size, rand(), type, u || 0);
}

// 树的轮廓：一层一层的"裙摆"，越往上越窄
function profile(t) {
  const taper = Math.pow(1 - t, 0.92);
  const tier = 1 - ((t * TIERS) % 1);
  return RADIUS * taper * (0.56 + 0.44 * tier) + 0.03;
}
const sampleT = () => 1 - Math.sqrt(1 - rand() * 0.995);   // 越靠下粒子越多（那里面积大）

// 0 = 树身
for (let i = 0; i < CONFIG.counts.tree; i++) {
  const t = sampleT(), ang = rand() * TAU;
  const shell = rand() < 0.86;
  const tier = 1 - ((t * TIERS) % 1);
  const rr = profile(t) * (shell ? 1 - 0.1 * rand() * rand() : Math.sqrt(rand()) * 0.94);
  const y = BASE + t * (H - BASE) + (rand() - 0.5) * 0.07;
  let col;
  const k = rand();
  if (shell && tier > 0.86 && k < 0.7) col = mixc(C.gold, C.paleGold, rand());            // 每层裙边镶金
  else if (k < 0.12) col = C.gold;
  else if (k < 0.2) col = mixc(C.pink, C.rose, 0.3 + rand() * 0.6);
  else col = mixc(C.deepRose, C.rose, rand());
  col = mixc(col, C.pink, t * 0.08);                                                       // 越往上越亮
  const gain = shell ? 0.4 + rand() * 0.5 : 0.18;
  add(Math.cos(ang) * rr, y, Math.sin(ang) * rr, mul(col, gain), 0.05 + Math.pow(rand(), 3) * 0.12, 0);
}
// 树干
for (let i = 0; i < 500; i++) {
  const ang = rand() * TAU, rr = 0.26 * Math.sqrt(rand());
  add(Math.cos(ang) * rr, rand() * (BASE + 0.4), Math.sin(ang) * rr, mul(C.gold, 0.22), 0.06 + rand() * 0.05, 0);
}

// 1 = 闪烁的装饰星
const ornamentColors = [C.gold, C.paleGold, C.pink, C.rose, [1, 0.75, 0.8]];
for (let i = 0; i < CONFIG.counts.ornaments; i++) {
  const t = sampleT() * 0.94, ang = rand() * TAU, rr = profile(t) * 0.98;
  const col = ornamentColors[(rand() * ornamentColors.length) | 0];
  add(Math.cos(ang) * rr, BASE + t * (H - BASE), Math.sin(ang) * rr, mul(col, 1.1), 0.34 + rand() * 0.3, 1);
}

// 2 = 盘旋而上的流光丝带（三条）
const STRANDS = 3, TURNS = 4.5;
for (let s = 0; s < STRANDS; s++) {
  for (let i = 0; i < CONFIG.counts.ribbon; i++) {
    const u = rand() * 0.985;
    const ang = u * TURNS * TAU + s * TAU / STRANDS;
    const rr = (RADIUS * Math.pow(1 - u, 0.92) * 0.87 + 0.14) * 1.08 + (rand() - 0.5) * 0.12;
    const y = BASE + u * (H - BASE) + (rand() - 0.5) * 0.12;
    add(Math.cos(ang) * rr, y, Math.sin(ang) * rr, mixc(C.gold, C.paleGold, rand()), 0.06 + Math.pow(rand(), 2) * 0.13, 2, s + u);
  }
}

// 3 = 树顶的星（两片互相垂直的五角星，从哪个角度看都完整）
const starPts = [];
for (let k = 0; k < 10; k++) {
  const a = Math.PI / 2 + k * Math.PI / 5, r = k % 2 ? 0.3 : 0.78;
  starPts.push([Math.cos(a) * r, Math.sin(a) * r]);
}
for (let i = 0; i < 900; i++) {
  const k = (rand() * 10) | 0, p = starPts[k], q = starPts[(k + 1) % 10], t = rand();
  let x = p[0] + (q[0] - p[0]) * t, y = p[1] + (q[1] - p[1]) * t;
  if (rand() < 0.45) { const s = Math.sqrt(rand()); x *= s; y *= s; }
  const j = (rand() - 0.5) * 0.04;
  const col = mul(mixc(C.gold, C.paleGold, rand()), 1.2);
  if (i % 2) add(x, STAR_Y + y, j, col, 0.07 + rand() * 0.08, 3);
  else add(j, STAR_Y + y, x, col, 0.07 + rand() * 0.08, 3);
}

// 4 = 雪花
for (let i = 0; i < CONFIG.counts.snow; i++) {
  add((rand() - 0.5) * 30, rand() * 18, (rand() - 0.5) * 30, [1, 0.86, 0.92], 0.035 + rand() * 0.06, 4);
}

// 5 = 地面光尘（上面会出现追着光走的树影）
for (let i = 0; i < CONFIG.counts.floor; i++) {
  const r = Math.pow(rand(), 0.62) * 10.5, ang = rand() * TAU;
  const col = rand() < 0.3 ? C.gold : mixc(C.deepRose, C.rose, rand());
  add(Math.cos(ang) * r, 0, Math.sin(ang) * r, mul(col, 0.9), 0.06 + rand() * 0.09, 5);
}

// 6 = 背景星空
for (let i = 0; i < CONFIG.counts.stars; i++) {
  const a = rand() * TAU, c = rand() * 1.5 - 0.5, s = Math.sqrt(Math.max(0, 1 - c * c)), r = 60 + rand() * 25;
  const col = rand() < 0.5 ? [1, 0.8, 0.86] : [1, 0.9, 0.7];
  add(Math.cos(a) * s * r, c * r, Math.sin(a) * s * r, col, 0.18 + rand() * 0.26, 6);
}

// 7 = 绕树飘起的爱心（位置里存的是：半径、起始高度、起始角度）
for (let i = 0; i < CONFIG.counts.hearts; i++) {
  const col = rand() < 0.6 ? C.rose : C.pink;
  add(4.2 + rand() * 3.4, rand() * 13, rand() * TAU, mul(col, 0.9), 0.3 + rand() * 0.26, 7);
}

const STRIDE = 13;
const COUNT = data.length / STRIDE;
const buffer = new Float32Array(data);

/* ============================ 着色器 ============================ */
const VS_POINTS = `#version 300 es
precision highp float;
layout(location=0) in vec3 aPos;
layout(location=1) in vec3 aScatter;
layout(location=2) in vec3 aColor;
layout(location=3) in vec4 aData;       // 大小, 相位, 类型, 附加值
uniform mat4 uVP;
uniform vec3 uLight;                     // 指向追光的方向
uniform float uTime, uForm, uMirror, uPx, uSpin, uGain, uMaxPt, uShadowLen;
out vec3 vColor;
flat out float vShape;

mat2 rot(float a) { float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }

void main() {
  float size = aData.x, ph = aData.y, type = aData.z, u = aData.w;
  vec3 p = aPos;
  float bright = 1.0, shape = 0.0, f = 1.0;

  // 镜像倒影里不画雪、地面和星空
  if (uMirror > 0.0 && type > 3.5 && type < 6.5) {
    gl_Position = vec4(2.0, 2.0, 2.0, 1.0); gl_PointSize = 1.0; vColor = vec3(0.0); vShape = 0.0; return;
  }

  if (type < 3.5) {                      // 属于树的粒子：聚合 / 散开 + 自转
    f = clamp(uForm * 1.7 - ph * 0.7, 0.0, 1.0);
    f = f * f * (3.0 - 2.0 * f);
    vec3 s = aScatter;
    s.xz = rot((1.0 - f) * 2.4 + uTime * 0.04) * s.xz;
    s.y += sin(uTime * 0.6 + ph * 6.283) * 0.5;
    p = mix(s, aPos, f);
    p.xz = rot(uSpin) * p.xz;
  }

  if (type < 0.5) {                      // 树身：受追光照亮，背光面变暗
    vec2 h = normalize(aPos.xz + vec2(1e-4, 0.0));
    vec3 n = normalize(vec3(h.x, 0.38, h.y));
    n.xz = rot(uSpin) * n.xz;
    float d = max(dot(n, uLight), 0.0);
    float lit = 0.10 + 2.1 * pow(d, 1.3);
    float tw = 0.75 + 0.25 * sin(uTime * (1.5 + ph * 3.0) + ph * 40.0);
    float sparkle = pow(max(sin(uTime * (0.8 + ph * 1.7) + ph * 97.0), 0.0), 24.0) * 2.5;
    bright = mix(0.8, lit, f) * tw + sparkle;
  } else if (type < 1.5) {               // 装饰星：十字星芒，忽明忽暗
    shape = 2.0;
    bright = 0.45 + 1.1 * pow(0.5 + 0.5 * sin(uTime * (1.2 + ph * 2.0) + ph * 50.0), 3.0);
  } else if (type < 2.5) {               // 丝带：一团团光沿着螺旋向上追逐，后面拖着尾巴
    float strand = floor(u), uu = fract(u);
    float w = fract(uu * 3.0 - uTime * 0.22 + strand * 0.3333);
    float head = pow(w, 7.0);
    bright = (0.14 + 3.2 * head) * (0.8 + 0.2 * sin(uTime * 5.0 + ph * 30.0));
    size *= 0.8 + 1.4 * head;
  } else if (type < 3.5) {               // 树顶星
    bright = 1.5 + 0.5 * sin(uTime * 2.2 + ph * 6.0);
  } else if (type < 4.5) {               // 雪
    p.y = mod(aPos.y - uTime * (0.35 + ph * 0.5), 18.0);
    p.x += sin(uTime * 0.5 + ph * 20.0) * 0.5;
    p.z += cos(uTime * 0.4 + ph * 17.0) * 0.5;
    bright = 0.32 * smoothstep(0.0, 1.5, p.y);
  } else if (type < 5.5) {               // 地面：光晕涟漪 + 树投下的影子
    float r = length(aPos.xz);
    vec2 dir = aPos.xz / max(r, 1e-3);
    vec2 Lh = normalize(uLight.xz);
    float ripple = 0.5 + 0.5 * sin(r * 2.4 - uTime * 1.6);
    float fall = exp(-r * 0.17);
    float along = dot(aPos.xz, -Lh);                       // 沿着影子方向走了多远
    float lat = abs(aPos.x * Lh.y - aPos.z * Lh.x);        // 离影子中线多远
    float wdt = ${RADIUS.toFixed(2)} * (1.0 - along / uShadowLen);
    float inside = smoothstep(-0.2, 0.9, along) * smoothstep(0.0, 0.7, wdt - lat);
    float side = 1.0 + 0.35 * dot(dir, Lh) * smoothstep(0.0, 3.0, r);
    bright = (0.45 + 0.55 * ripple) * fall * 1.5 * side * (1.0 - 0.94 * inside * uForm);
  } else if (type < 6.5) {               // 星空
    bright = 0.2 + 0.2 * sin(uTime * (0.5 + ph) + ph * 30.0);
  } else {                               // 爱心
    shape = 1.0;
    float y = mod(aPos.y + uTime * (0.25 + ph * 0.3), 13.0);
    float a = aPos.z + uTime * 0.12 + sin(uTime * 0.7 + ph * 9.0) * 0.2;
    p = vec3(cos(a) * aPos.x, y, sin(a) * aPos.x);
    bright = 0.6 * smoothstep(0.0, 2.0, y) * (1.0 - smoothstep(10.0, 13.0, y)) * uForm;
  }

  float alpha = 1.0;
  if (uMirror > 0.0) {                   // 倒影：上下翻转，越高的地方越淡
    alpha = 0.3 * uMirror * exp(-max(p.y, 0.0) * 0.24);
    p.y = -p.y;
  }

  vec4 clip = uVP * vec4(p, 1.0);
  gl_Position = clip;
  float px = size * uPx / max(clip.w, 0.1);
  gl_PointSize = clamp(px, 1.5, uMaxPt);
  vColor = aColor * bright * alpha * min(1.0, px / 1.5) * uGain;
  vShape = shape;
}`;

const FS_POINTS = `#version 300 es
precision highp float;
in vec3 vColor;
flat in float vShape;
out vec4 o;
void main() {
  vec2 p = gl_PointCoord * 2.0 - 1.0;
  float d = dot(p, p), a;
  if (vShape < 0.5) {                    // 圆形柔光点
    a = exp(-d * 5.5) - 0.004 + 0.9 * exp(-d * 40.0);
  } else if (vShape < 1.5) {             // 爱心
    vec2 q = vec2(p.x, -p.y) * 1.3; q.y += 0.2;
    float h = pow(q.x * q.x + q.y * q.y - 1.0, 3.0) - q.x * q.x * q.y * q.y * q.y;
    a = (1.0 - smoothstep(-0.15, 0.04, h)) * 0.85 + 0.2 * exp(-d * 3.0) * (1.0 - smoothstep(0.7, 1.0, d));
  } else {                               // 十字星芒
    float rays = exp(-abs(p.x) * 18.0) * exp(-abs(p.y) * 2.6) + exp(-abs(p.y) * 18.0) * exp(-abs(p.x) * 2.6);
    a = exp(-d * 14.0) * 1.2 + rays * 0.7 * (1.0 - smoothstep(0.55, 1.0, d));
  }
  if (a <= 0.0) discard;
  o = vec4(vColor * a, 1.0);
}`;

const VS_QUAD = `#version 300 es
out vec2 vUv;
void main() {
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  vUv = p;
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;

// 模糊（方向为 0 时就是单纯的缩小拷贝）
const FS_BLUR = `#version 300 es
precision highp float;
in vec2 vUv;
uniform sampler2D uTex;
uniform vec2 uDir;
out vec4 o;
void main() {
  vec3 c = texture(uTex, vUv).rgb * 0.2270270270;
  c += texture(uTex, vUv + uDir * 1.3846153846).rgb * 0.3162162162;
  c += texture(uTex, vUv - uDir * 1.3846153846).rgb * 0.3162162162;
  c += texture(uTex, vUv + uDir * 3.2307692308).rgb * 0.0702702703;
  c += texture(uTex, vUv - uDir * 3.2307692308).rgb * 0.0702702703;
  o = vec4(c, 1.0);
}`;

// 合成：原图 + 三层光晕 + 树顶星芒 + 背景 + 色调映射
const FS_FINAL = `#version 300 es
precision highp float;
in vec2 vUv;
uniform sampler2D uScene, uB1, uB2, uB3;
uniform vec3 uStar;                      // 树顶星在屏幕上的位置 (xy) 和亮度 (z)
uniform float uAspect, uExposure, uTime;
out vec4 o;
float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
void main() {
  vec3 c = texture(uScene, vUv).rgb;
  c += texture(uB1, vUv).rgb * 0.28 + texture(uB2, vUv).rgb * 0.3 + texture(uB3, vUv).rgb * 0.34;

  vec2 d = (vUv - uStar.xy) * vec2(uAspect, 1.0);
  float r2 = dot(d, d);
  float glow = exp(-r2 * 1800.0) * 0.9 + exp(-r2 * 140.0) * 0.16;
  float rays = exp(-abs(d.y) * 260.0) * exp(-abs(d.x) * 17.0) + exp(-abs(d.x) * 260.0) * exp(-abs(d.y) * 24.0);
  c += uStar.z * vec3(1.0, 0.72, 0.3) * (glow + rays * 0.42);

  vec2 q = (vUv - 0.5) * vec2(uAspect, 1.0);
  vec3 bg = mix(vec3(0.030, 0.002, 0.016), vec3(0.003, 0.0, 0.006), smoothstep(0.0, 0.95, length(q - vec2(0.0, -0.12))));

  c = bg + c * uExposure;
  float m = max(c.r, max(c.g, c.b));                       // 按最亮的通道压缩亮度，保住玫红和金色本来的色相
  c *= (1.0 - exp(-m)) / max(m, 1e-4);
  c = mix(c, vec3(1.0), 0.55 * smoothstep(1.6, 9.0, m)); // 只有非常亮的核心才发白
  c = pow(c, vec3(1.0 / 2.2));
  c *= 1.0 - 0.32 * dot(q, q);
  c += (hash(gl_FragCoord.xy + fract(uTime)) - 0.5) / 255.0;
  o = vec4(c, 1.0);
}`;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function program(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const info = gl.getActiveUniform(p, i); u[info.name] = gl.getUniformLocation(p, info.name); }
  return { p, u };
}
const progPoints = program(VS_POINTS, FS_POINTS);
const progBlur = program(VS_QUAD, FS_BLUR);
const progFinal = program(VS_QUAD, FS_FINAL);

/* ============================ 缓冲区 ============================ */
const vao = gl.createVertexArray();
gl.bindVertexArray(vao);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, buffer, gl.STATIC_DRAW);
const BYTES = STRIDE * 4;
[[0, 3, 0], [1, 3, 12], [2, 3, 24], [3, 4, 36]].forEach(([loc, n, off]) => {
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, n, gl.FLOAT, false, BYTES, off);
});
const emptyVao = gl.createVertexArray();

// 高动态范围的画布：亮的地方不会直接变成一片死白
let hdr = !!gl.getExtension('EXT_color_buffer_float') || !!gl.getExtension('EXT_color_buffer_half_float');
function makeTarget(w, h) {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  if (hdr) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
  else gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
  return { tex, fbo, w, h, ok };
}
function freeTarget(t) { gl.deleteTexture(t.tex); gl.deleteFramebuffer(t.fbo); }

let scene = null, levels = [];
let W = 0, HH = 0, dpr = 1;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(2, Math.floor(canvas.clientWidth * dpr)), h = Math.max(2, Math.floor(canvas.clientHeight * dpr));
  if (w === W && h === HH) return;
  W = w; HH = h; canvas.width = w; canvas.height = h;
  if (scene) freeTarget(scene);
  levels.forEach(l => { freeTarget(l.a); freeTarget(l.b); });
  scene = makeTarget(w, h);
  if (!scene.ok && hdr) { hdr = false; freeTarget(scene); scene = makeTarget(w, h); }
  levels = [];
  for (let i = 1; i <= 3; i++) {
    const lw = Math.max(2, w >> i), lh = Math.max(2, h >> i);
    levels.push({ a: makeTarget(lw, lh), b: makeTarget(lw, lh) });
  }
}

/* ============================ 矩阵 ============================ */
function perspective(fov, aspect, near, far) {
  const f = 1 / Math.tan(fov / 2), m = new Float32Array(16);
  m[0] = f / aspect; m[5] = f; m[10] = (far + near) / (near - far); m[11] = -1; m[14] = 2 * far * near / (near - far);
  return m;
}
function lookAt(e, t) {
  let zx = e[0] - t[0], zy = e[1] - t[1], zz = e[2] - t[2];
  let l = Math.hypot(zx, zy, zz); zx /= l; zy /= l; zz /= l;
  let xx = zz, xy = 0, xz = -zx;                    // up(0,1,0) × z
  l = Math.hypot(xx, xy, xz); xx /= l; xz /= l;
  const yx = zy * xz - zz * xy, yy = zz * xx - zx * xz, yz = zx * xy - zy * xx;
  return new Float32Array([xx, yx, zx, 0, xy, yy, zy, 0, xz, yz, zz, 0,
    -(xx * e[0] + xy * e[1] + xz * e[2]), -(yx * e[0] + yy * e[1] + yz * e[2]), -(zx * e[0] + zy * e[1] + zz * e[2]), 1]);
}
function matmul(a, b) {
  const o = new Float32Array(16);
  for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) {
    let s = 0; for (let k = 0; k < 4; k++) s += a[k * 4 + r] * b[c * 4 + k];
    o[c * 4 + r] = s;
  }
  return o;
}

/* ============================ 交互 ============================ */
const FOV = 40 * Math.PI / 180;
let yaw = 0.5, pitch = 0.2, dist = 26, vYaw = 0, vPitch = 0;
let form = 0, formTarget = 0;
const pointers = new Map();
let pinch = 0;
const hint = document.getElementById('hint');
const toggleBtn = document.getElementById('toggle');
const hideHint = () => hint.classList.add('gone');

function toggleForm() {
  formTarget = formTarget > 0.5 ? 0 : 1;
  toggleBtn.textContent = formTarget > 0.5 ? '散开' : '聚合';
}
toggleBtn.addEventListener('click', toggleForm);
canvas.addEventListener('dblclick', toggleForm);
window.addEventListener('keydown', e => { if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); toggleForm(); } });

canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  canvas.classList.add('dragging');
  vYaw = vPitch = 0; pinch = 0;
});
canvas.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  if (pointers.size === 1) {
    yaw -= dx * 0.006; pitch += dy * 0.005;
    vYaw = Math.max(-0.05, Math.min(0.05, -dx * 0.006));
    vPitch = Math.max(-0.03, Math.min(0.03, dy * 0.005));
    if (Math.abs(dx) + Math.abs(dy) > 2) hideHint();
  } else if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinch > 0) dist *= pinch / Math.max(d, 1);
    pinch = d; hideHint();
  }
});
function release(e) {
  pointers.delete(e.pointerId); pinch = 0;
  if (!pointers.size) canvas.classList.remove('dragging');
}
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', release);
canvas.addEventListener('wheel', e => { e.preventDefault(); dist *= Math.exp(e.deltaY * 0.0012); hideHint(); }, { passive: false });
setTimeout(hideHint, 12000);

/* ============================ 每一帧 ============================ */
const maxPoint = gl.getParameter(gl.ALIASED_POINT_SIZE_RANGE)[1];
const TARGET = [0, 6.0, 0];
const LIGHT_Y = 1.15;
let last = performance.now(), time = 0, spin = 0;

function drawQuad(prog, target, w, h) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, target);
  gl.viewport(0, 0, w, h);
  gl.useProgram(prog.p);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now; time += dt; spin += dt * CONFIG.spinSpeed;
  resize();

  // 聚合进度 + 松手后的惯性
  const step = dt / 2.6;
  form = formTarget > form ? Math.min(formTarget, form + step) : Math.max(formTarget, form - step);
  if (!pointers.size) { yaw += vYaw; pitch += vPitch; vYaw *= 0.93; vPitch *= 0.86; }
  pitch = Math.min(1.05, Math.max(0.03, pitch));
  dist = Math.min(46, Math.max(11, dist));

  // 相机：围着树转
  const aspect = W / HH;
  const dd = dist * Math.max(1, 0.62 / aspect);            // 竖屏时自动拉远，保证整棵树都在画面里
  const cp = Math.cos(pitch);
  const eye = [TARGET[0] + dd * cp * Math.sin(yaw), TARGET[1] + dd * Math.sin(pitch), TARGET[2] + dd * cp * Math.cos(yaw)];
  const vp = matmul(perspective(FOV, aspect, 0.1, 250), lookAt(eye, TARGET));

  // 追光：绕着树转的光源
  const la = time * CONFIG.lightSpeed;
  const ll = Math.hypot(1, LIGHT_Y);
  const light = [Math.cos(la) / ll, LIGHT_Y / ll, Math.sin(la) / ll];

  // 1) 把所有粒子画进高动态范围画布（先画倒影，再画本体）
  gl.bindFramebuffer(gl.FRAMEBUFFER, scene.fbo);
  gl.viewport(0, 0, W, HH);
  gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.disable(gl.DEPTH_TEST);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
  gl.useProgram(progPoints.p);
  const u = progPoints.u;
  gl.uniformMatrix4fv(u.uVP, false, vp);
  gl.uniform3fv(u.uLight, light);
  gl.uniform1f(u.uTime, time);
  gl.uniform1f(u.uForm, form);
  gl.uniform1f(u.uSpin, spin);
  gl.uniform1f(u.uPx, HH / (2 * Math.tan(FOV / 2)));
  gl.uniform1f(u.uGain, hdr ? 1 : 0.3);
  gl.uniform1f(u.uMaxPt, Math.min(maxPoint, 96 * dpr));
  gl.uniform1f(u.uShadowLen, (H + 0.6) / LIGHT_Y);
  gl.bindVertexArray(vao);
  const gloss = 1 - 0.85 * Math.min(1, Math.max(0, (pitch - 0.15) / 0.55));   // 俯视时倒影变淡
  gl.uniform1f(u.uMirror, gloss); gl.drawArrays(gl.POINTS, 0, COUNT);
  gl.uniform1f(u.uMirror, 0); gl.drawArrays(gl.POINTS, 0, COUNT);

  // 2) 逐级缩小并模糊，得到三层光晕
  gl.disable(gl.BLEND);
  gl.bindVertexArray(emptyVao);
  gl.useProgram(progBlur.p);
  gl.activeTexture(gl.TEXTURE0);
  gl.uniform1i(progBlur.u.uTex, 0);
  let src = scene.tex;
  for (const l of levels) {
    gl.bindTexture(gl.TEXTURE_2D, src);
    gl.uniform2f(progBlur.u.uDir, 0, 0);
    drawQuad(progBlur, l.a.fbo, l.a.w, l.a.h);
    gl.bindTexture(gl.TEXTURE_2D, l.a.tex);
    gl.uniform2f(progBlur.u.uDir, 1 / l.a.w, 0);
    drawQuad(progBlur, l.b.fbo, l.b.w, l.b.h);
    gl.bindTexture(gl.TEXTURE_2D, l.b.tex);
    gl.uniform2f(progBlur.u.uDir, 0, 1 / l.a.h);
    drawQuad(progBlur, l.a.fbo, l.a.w, l.a.h);
    src = l.a.tex;
  }

  // 3) 合成到屏幕
  const sx = vp[4] * STAR_Y + vp[12], sy = vp[5] * STAR_Y + vp[13], sw = vp[7] * STAR_Y + vp[15];
  const starOn = Math.max(0, Math.min(1, form * 1.7 - 0.7));
  gl.useProgram(progFinal.p);
  const f = progFinal.u;
  [scene.tex, levels[0].a.tex, levels[1].a.tex, levels[2].a.tex].forEach((t, i) => {
    gl.activeTexture(gl.TEXTURE0 + i); gl.bindTexture(gl.TEXTURE_2D, t);
  });
  gl.uniform1i(f.uScene, 0); gl.uniform1i(f.uB1, 1); gl.uniform1i(f.uB2, 2); gl.uniform1i(f.uB3, 3);
  gl.uniform3f(f.uStar, sx / sw * 0.5 + 0.5, sy / sw * 0.5 + 0.5, sw > 0 ? starOn * starOn * (0.85 + 0.15 * Math.sin(time * 2.2)) : 0);
  gl.uniform1f(f.uAspect, aspect);
  gl.uniform1f(f.uExposure, CONFIG.exposure * (hdr ? 1 : 1 / 0.3));
  gl.uniform1f(f.uTime, time);
  drawQuad(progFinal, null, W, HH);

  requestAnimationFrame(frame);
}

resize();
requestAnimationFrame(frame);
// 开场：粒子从四面八方聚合成树
setTimeout(() => { formTarget = 1; document.body.classList.add('ready'); }, 500);
</script>
</body>
</html>
