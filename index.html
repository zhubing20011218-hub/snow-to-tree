<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>雪落成树</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { font-family: -apple-system, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  canvas.dragging { cursor: grabbing; }

  .title {
    position: fixed; left: clamp(24px, 7vw, 110px); top: 50%; transform: translateY(-50%);
    pointer-events: none; user-select: none;
    opacity: 0; transition: opacity 3s ease;
  }
  .formed .title { opacity: 1; transition-delay: 1.2s; }
  .title h1 {
    margin: 0; font-weight: 400; font-style: italic; line-height: 1.2;
    font-family: "Didot", "Bodoni 72", "Playfair Display", "Times New Roman", Georgia, serif;
    font-size: clamp(22px, 2.9vw, 40px); letter-spacing: .01em;
    color: #f4e3c8;
  }
  .title p {
    margin: 14px 0 0; font-size: 11px; letter-spacing: .5em; color: rgba(255, 150, 190, .7);
  }
  @media (max-width: 760px) {
    .title { left: 0; right: 0; top: max(34px, env(safe-area-inset-top)); transform: none; text-align: center; }
    .title p { text-indent: .5em; }
  }

  .hint {
    position: fixed; left: 0; right: 0; bottom: max(22px, env(safe-area-inset-bottom));
    text-align: center; font-size: 11px; letter-spacing: .32em; text-indent: .32em;
    color: rgba(255, 255, 255, .34); pointer-events: none; user-select: none;
    transition: opacity 1.5s ease;
  }
  .hint.gone { opacity: 0; }

  #fallback {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: 24px; text-align: center; line-height: 1.8; color: #f4e3c8;
  }
  #fallback[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div class="title">
  <h1 id="titleText"></h1>
  <p id="subText"></p>
</div>

<div class="hint" id="hint">拖动旋转 · 滚轮缩放 · 双击化雪</div>

<div id="fallback" hidden>这个浏览器不支持 WebGL2，请换用新版 Chrome、Edge 或 Safari 打开。</div>

<script>
'use strict';

/* =====================================================================
   可以自己改的地方（改完保存，刷新浏览器就能看到）
   ===================================================================== */
const CONFIG = {
  title: 'Merry Christmas,',         // 左边的标题
  subtitle: 'FOR YOU',               // 标题下面的小字，可以改成她的名字

  colors: {                          // 颜色（网页常用的 #十六进制 写法）
    rose:     '#ff2f86',             // 玫红（主色）
    deepRose: '#c2185b',             // 深玫红
    blush:    '#ffb3cf',             // 浅粉
    gold:     '#ffcf6b'              // 金色
  },

  counts: {                          // 粒子数量（电脑卡顿就把数字调小）
    ribbon: 64000,                   // 玫红色的螺旋树
    thread: 9000,                    // 反向缠绕的金线
    dust: 12000,                     // 树身周围的浮尘
    snow: 6500                       // 雪
  },

  spinSpeed: 0.2,                    // 树自转速度（0 = 不转）
  cometSpeed: 0.1,                   // 那团金色的光爬到树顶的速度
  exposure: 1.0                      // 整体亮度
};

/* ============================ 基础工具 ============================ */
const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, powerPreference: 'high-performance' });
document.getElementById('titleText').textContent = CONFIG.title;
document.getElementById('subText').textContent = CONFIG.subtitle;

if (!gl) {
  document.getElementById('fallback').hidden = false;
  throw new Error('WebGL2 not supported');
}

const rand = Math.random;
const TAU = Math.PI * 2;
const gauss = () => (rand() + rand() + rand() + rand() - 2) / 2;   // 中间密、两边稀的随机数

// 把 #rrggbb 转成线性空间的 RGB（渲染最后会统一做一次色调映射）
function hex(h) {
  const n = parseInt(h.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(v => Math.pow(v / 255, 2.2));
}
const C = {};
for (const k in CONFIG.colors) C[k] = hex(CONFIG.colors[k]);
const mixc = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const mul = (a, s) => [a[0] * s, a[1] * s, a[2] * s];

/* ============================ 生成粒子 ============================ */
// 每个粒子 13 个数字：位置(3) 化成雪时的位置(3) 颜色(3) 大小 相位 类型 附加值
const H = 10, R = 3.4, TURNS = 6, STAR_Y = 10.25;
const SNOW_W = 60, SNOW_H = 25;          // 下雪的范围（宽 × 高）
const data = [];

function add(x, y, z, col, size, type, extra) {
  data.push(x, y, z, (rand() - 0.5) * SNOW_W, rand() * SNOW_H, (rand() - 0.5) * SNOW_W,
            col[0], col[1], col[2], size, rand(), type, extra || 0);
}

// ---- 先放"属于树"的粒子（它们会有倒影，也会化成雪） ----

// 0 = 玫红螺旋丝带。位置里存的是：在丝带上的进度、离丝带中线的横向偏移、纵向偏移
for (let i = 0; i < CONFIG.counts.ribbon; i++) {
  const stray = rand() < 0.2 ? 2.4 : 1;                 // 少量粒子飘得更散，像扬起的雪粉
  const k = rand();
  let col = k < 0.8 ? mixc(C.deepRose, C.rose, rand()) : k < 0.93 ? mixc(C.rose, C.blush, rand()) : C.gold;
  const gain = (0.16 + Math.pow(rand(), 2) * 0.85) / (stray > 1 ? 1.6 : 1);
  add(rand(), gauss() * stray, gauss() * stray, mul(col, gain), 0.03 + Math.pow(rand(), 3) * 0.05, 0);
}
// 1 = 圆锥形的浮尘，让轮廓更像一棵树
for (let i = 0; i < CONFIG.counts.dust; i++) {
  const t = 1 - Math.sqrt(1 - rand() * 0.98), ang = rand() * TAU;
  const rr = (R * Math.pow(1 - t, 1.12) + 0.05) * Math.sqrt(rand()) * 1.08;
  add(Math.cos(ang) * rr, H * t, Math.sin(ang) * rr, mul(mixc(C.deepRose, C.blush, rand()), 0.26), 0.025 + rand() * 0.03, 1);
}
// 树尖上的一小簇金色
for (let i = 0; i < 160; i++) {
  const a = rand() * TAU, c = rand() * 2 - 1, s = Math.sqrt(1 - c * c), r = Math.cbrt(rand()) * 0.16;
  add(Math.cos(a) * s * r, STAR_Y + c * r, Math.sin(a) * s * r, mul(C.gold, 1.2), 0.035 + rand() * 0.04, 1);
}
// 2 = 反方向缠绕的金线
for (let i = 0; i < CONFIG.counts.thread; i++) {
  add(rand(), gauss(), gauss(), mul(mixc(C.gold, [1, 0.9, 0.7], rand()), 0.25 + rand() * 0.6), 0.028 + Math.pow(rand(), 3) * 0.04, 2);
}
// 3 = 沿着丝带往上爬的那团光（彗星）。位置里存的是：落后彗头多远、横向偏移、纵向偏移
for (let i = 0; i < 700; i++) {
  add(-Math.log(1 - rand() * 0.995) * 0.012, gauss(), gauss(), mul(mixc(C.gold, [1, 0.95, 0.85], rand()), 1.0), 0.04 + rand() * 0.06, 3);
}
const TREE_COUNT = data.length / 13;

// ---- 然后是环境 ----

// 4 = 雪
for (let i = 0; i < CONFIG.counts.snow; i++) {
  const big = rand() < 0.1;
  add((rand() - 0.5) * SNOW_W, rand() * SNOW_H, (rand() - 0.5) * SNOW_W, [1, 0.97, 0.98],
      big ? 0.08 + rand() * 0.08 : 0.022 + rand() * 0.04, 4);
}
// 5 = 地面上一圈圈的涟漪
for (let k = 0, r = 0.9; r < 15; k++, r *= 1.135) {
  const n = Math.floor(230 * r);
  for (let i = 0; i < n; i++) {
    const ang = rand() * TAU, rr = r + gauss() * 0.05;
    add(Math.cos(ang) * rr, 0, Math.sin(ang) * rr, mul(mixc(C.rose, [1, 1, 1], 0.55 + rand() * 0.3), 0.5 + rand() * 0.5), 0.028 + rand() * 0.035, 5, k);
  }
}
// 6 = 彗星到达树顶时，从树尖喷出的雪屑。位置里存的是飞出去的方向和速度
for (let i = 0; i < 600; i++) {
  const a = rand() * TAU, c = rand() * 1.4 - 0.4, s = Math.sqrt(Math.max(0, 1 - c * c)), v = 0.5 + rand() * 1.9;
  add(Math.cos(a) * s * v, c * v, Math.sin(a) * s * v, rand() < 0.6 ? C.gold : [1, 0.95, 0.96], 0.03 + rand() * 0.05, 6);
}

const STRIDE = 13;
const COUNT = data.length / STRIDE;
const buffer = new Float32Array(data);

/* ============================ 着色器 ============================ */
const VS_POINTS = `#version 300 es
precision highp float;
layout(location=0) in vec3 aPos;
layout(location=1) in vec3 aScatter;
layout(location=2) in vec3 aColor;
layout(location=3) in vec4 aData;       // 大小, 相位, 类型, 附加值
uniform mat4 uVP;
uniform vec4 uComet;                     // 彗星的位置 (xyz) 和亮度 (w)
uniform vec3 uPointer;                   // 鼠标在屏幕上的位置 (xy) 和活跃度 (z)
uniform vec3 uGold;
uniform float uTime, uForm, uMirror, uPx, uSpin, uGain, uMaxPt, uCometQ, uPulseAge, uAspect, uDist;
out vec3 vColor;
flat out float vShape;

const float H = ${H.toFixed(1)}, R = ${R.toFixed(2)}, TURNS = ${TURNS.toFixed(1)}, STAR_Y = ${STAR_Y.toFixed(2)};
const float SNOW_W = ${SNOW_W.toFixed(1)}, SNOW_H = ${SNOW_H.toFixed(1)};

mat2 rot(float a) { float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }

// 螺旋丝带：q 是沿着丝带走了多远（0 = 地面，1 = 树尖）
vec3 helix(float q, float dir, float jr, float jy, float wScale, out float t) {
  t = 1.0 - sqrt(1.0 - q);
  float ang = dir * TURNS * 6.2831853 * pow(t, 0.8);
  float r = R * pow(1.0 - t, 1.12) + 0.04;
  float w = (0.08 + 0.6 * (1.0 - t)) * wScale;
  float rr = r + jr * w;
  return vec3(cos(ang) * rr, H * t + jy * w * 0.5, sin(ang) * rr);
}

// 雪的飘落：一边下落，一边被风吹着横移、左右摇摆
vec3 snowfall(vec3 s, float ph, out float edge) {
  vec3 p = s;
  p.y = mod(s.y - uTime * (0.5 + ph * 0.9), SNOW_H) - 3.0;
  p.x = mod(s.x + uTime * 0.28 * (0.5 + ph) + SNOW_W * 0.5, SNOW_W) - SNOW_W * 0.5 + sin(uTime * 0.35 + ph * 40.0) * 0.6;
  p.z = s.z + cos(uTime * 0.3 + ph * 31.0) * 0.6;
  edge = smoothstep(-3.0, 0.5, p.y) * (1.0 - smoothstep(SNOW_H - 6.0, SNOW_H - 3.0, p.y))
       * (1.0 - smoothstep(SNOW_W * 0.5 - 3.0, SNOW_W * 0.5, abs(p.x)));
  return p;
}

void main() {
  float size = aData.x, ph = aData.y, type = aData.z, ex = aData.w;
  vec3 p = aPos, col = aColor;
  float bright = 1.0, alpha = 1.0;
  bool tree = type < 3.5;

  if (tree) {
    float q = 0.0, t = 0.0;
    if (type < 0.5) {                    // 玫红丝带：粒子缓缓向上流动
      q = fract(aPos.x + uTime * 0.010);
      p = helix(q, 1.0, aPos.y, aPos.z, 1.0, t);
      bright = smoothstep(0.0, 0.02, q) * (1.0 - smoothstep(0.985, 1.0, q));
      col = mix(col, uGold * 0.8, smoothstep(0.7, 1.0, t) * 0.65);
    } else if (type < 1.5) {             // 浮尘
      p = aPos;
    } else if (type < 2.5) {             // 金线
      q = fract(aPos.x + uTime * 0.018);
      p = helix(q, -1.0, aPos.y, aPos.z, 0.1, t);
      bright = smoothstep(0.0, 0.02, q) * (1.0 - smoothstep(0.985, 1.0, q));
    } else {                             // 彗星
      q = uCometQ - aPos.x;
      p = helix(clamp(q, 0.0, 0.999), 1.0, aPos.y, aPos.z, 0.22, t);
      bright = step(0.0, q) * uComet.w * (exp(-aPos.x * 60.0) * 3.5 + 0.35);
    }
    p.xz = rot(uSpin) * p.xz;

    if (type < 2.5) {
      // 闪烁
      float tw = 0.7 + 0.3 * sin(uTime * (1.2 + ph * 2.5) + ph * 40.0);
      float sp = pow(max(sin(uTime * (0.7 + ph * 1.6) + ph * 97.0), 0.0), 30.0) * 3.0;
      bright *= tw + sp;

      // 彗星经过时把附近照成金色，身后留下一条慢慢熄灭的光带
      vec3 dv = p - uComet.xyz;
      float g = uComet.w * exp(-dot(dv, dv) * 0.5);
      float tail = 0.0;
      if (type < 0.5) { float dq = uCometQ - q; tail = dq > 0.0 ? exp(-dq * 24.0) * uComet.w : 0.0; }
      col = mix(col, uGold, clamp(g * 1.2 + tail, 0.0, 1.0));
      bright *= 1.0 + 3.2 * g + 1.7 * tail;

      // 聚合 / 化雪：没聚合的时候，这些粒子就是漫天的雪
      float f = clamp(uForm * 1.6 - ph * 0.6, 0.0, 1.0);
      f = f * f * (3.0 - 2.0 * f);
      if (f < 1.0) {
        float edge;
        vec3 s = snowfall(aScatter, ph, edge);
        p = mix(s, p, f);
        col = mix(vec3(0.85, 0.82, 0.84), col, f);
        bright = mix(0.6 * edge * step(0.84, fract(ph * 7.13)), bright, f);
      }
    }
  } else if (type < 4.5) {               // 雪
    float edge;
    p = snowfall(aPos, ph, edge);
    bright = 0.5 * edge;
  } else if (type < 5.5) {               // 涟漪：一圈圈的光点，彗星到顶时会有一道金色的波纹荡开
    float r = length(aPos.xz), a = atan(aPos.z, aPos.x);
    p.xz = rot(uTime * 0.025 * (mod(ex, 2.0) < 0.5 ? 1.0 : -1.0)) * aPos.xz;
    float wave = sin(r * 1.7 - uTime * 1.1);
    float pulse = exp(-pow((r - uPulseAge * 3.4) / 0.8, 2.0)) * exp(-uPulseAge * 0.45);
    p.y = wave * 0.05 * smoothstep(0.0, 3.0, r) + pulse * 0.3;
    float arc = smoothstep(-0.35, 0.25, sin(a + ex * 2.4 + uTime * 0.03) + 0.4 * sin(a * 3.0 - ex * 1.3));
    bright = (0.22 + 0.3 * (0.5 + 0.5 * wave)) * exp(-r * 0.12) * arc * 1.7 * mix(0.35, 1.0, uForm) + pulse * 1.8;
    col = mix(col, uGold, clamp(pulse * 1.4, 0.0, 1.0));
  } else {                               // 树尖喷出的雪屑
    float age = uPulseAge;
    float tt = (1.0 - exp(-age * 1.1)) / 1.1;
    p = vec3(0.0, STAR_Y, 0.0) + aPos * tt * 1.8 + vec3(sin(age * 0.8 + ph * 20.0) * 0.15 * age, -0.12 * age * age, 0.0);
    bright = exp(-age * 0.5) * (0.5 + 0.9 * pow(0.5 + 0.5 * sin(uTime * 6.0 + ph * 50.0), 4.0)) * 1.3 * step(age, 20.0);
  }

  if (uMirror > 0.0) {                   // 倒影：上下翻转，越高的地方越淡
    alpha = 0.16 * uMirror * exp(-max(p.y, 0.0) * 0.22);
    p.y = -p.y;
  }

  vec4 clip = uVP * vec4(p, 1.0);

  // 远处的粒子暗一点，让前后层次更清楚
  if (tree) bright *= mix(1.0, 0.45, smoothstep(uDist - 3.5, uDist + 3.5, clip.w));

  // 鼠标划过的地方，粒子像被吹了一口气一样散开
  vec2 nd = clip.xy / max(clip.w, 0.001);
  vec2 dv = (nd - uPointer.xy) * vec2(uAspect, 1.0);
  float dd = dot(dv, dv);
  float push = uPointer.z * exp(-dd * 24.0) * (0.3 + 1.4 * ph);
  clip.xy += dv / (sqrt(dd) + 0.03) * push * 0.075 * clip.w / vec2(uAspect, 1.0);

  gl_Position = clip;
  float px = size * uPx / max(clip.w, 0.1);
  float shape = 0.0;
  if (px > 12.0) {                       // 离镜头很近的粒子：虚化成淡淡的光斑，太近的直接淡出
    shape = 1.0;
    bright *= pow(12.0 / px, 2.0) * (1.0 - smoothstep(uMaxPt * 0.55, uMaxPt, px));
  }
  gl_PointSize = clamp(px, 1.5, uMaxPt);
  vColor = col * bright * alpha * min(1.0, px / 1.5) * uGain;
  vShape = shape;
}`;

const FS_POINTS = `#version 300 es
precision highp float;
in vec3 vColor;
flat in float vShape;
out vec4 o;
void main() {
  vec2 p = gl_PointCoord * 2.0 - 1.0;
  float d = dot(p, p), a;
  if (vShape < 0.5) a = exp(-d * 4.5) - 0.011 + 0.8 * exp(-d * 30.0);   // 细小的光点
  else a = (1.0 - smoothstep(0.55, 1.0, d)) * 0.5;                       // 虚化的光斑
  if (a <= 0.0) discard;
  o = vec4(vColor * a, 1.0);
}`;

const VS_QUAD = `#version 300 es
out vec2 vUv;
void main() {
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  vUv = p;
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;

// 模糊（方向为 0 时就是单纯的缩小拷贝）
const FS_BLUR = `#version 300 es
precision highp float;
in vec2 vUv;
uniform sampler2D uTex;
uniform vec2 uDir;
out vec4 o;
void main() {
  vec3 c = texture(uTex, vUv).rgb * 0.2270270270;
  c += texture(uTex, vUv + uDir * 1.3846153846).rgb * 0.3162162162;
  c += texture(uTex, vUv - uDir * 1.3846153846).rgb * 0.3162162162;
  c += texture(uTex, vUv + uDir * 3.2307692308).rgb * 0.0702702703;
  c += texture(uTex, vUv - uDir * 3.2307692308).rgb * 0.0702702703;
  o = vec4(c, 1.0);
}`;

// 合成：原图 + 一点点光晕 + 树尖和彗星的辉光，背景保持纯黑
const FS_FINAL = `#version 300 es
precision highp float;
in vec2 vUv;
uniform sampler2D uScene, uB1, uB2, uB3;
uniform vec3 uStar, uCometS;             // 屏幕上的位置 (xy) 和亮度 (z)
uniform vec3 uGold;
uniform float uAspect, uExposure, uTime;
out vec4 o;
float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
void main() {
  vec3 c = texture(uScene, vUv).rgb;
  c += texture(uB1, vUv).rgb * 0.16 + texture(uB2, vUv).rgb * 0.18 + texture(uB3, vUv).rgb * 0.22;

  vec2 d = (vUv - uStar.xy) * vec2(uAspect, 1.0);
  float r2 = dot(d, d);
  float spikes = exp(-abs(d.y) * 340.0) * exp(-abs(d.x) * 30.0) + exp(-abs(d.x) * 340.0) * exp(-abs(d.y) * 30.0);
  c += uStar.z * uGold * (exp(-r2 * 3200.0) * 1.3 + exp(-r2 * 240.0) * 0.12 + spikes * 0.3);

  d = (vUv - uCometS.xy) * vec2(uAspect, 1.0);
  r2 = dot(d, d);
  c += uCometS.z * uGold * (exp(-r2 * 3600.0) * 1.0 + exp(-r2 * 300.0) * 0.1);

  c *= uExposure;
  float m = max(c.r, max(c.g, c.b));                       // 按最亮的通道压缩亮度，保住玫红和金色本来的色相
  c *= (1.0 - exp(-m)) / max(m, 1e-4);
  c = mix(c, vec3(1.0), 0.5 * smoothstep(1.6, 9.0, m));   // 只有非常亮的核心才发白
  c = pow(c, vec3(1.0 / 2.2));
  c += (hash(gl_FragCoord.xy + fract(uTime)) - 0.5) / 255.0 * step(0.002, m);
  o = vec4(c, 1.0);
}`;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function program(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const info = gl.getActiveUniform(p, i); u[info.name] = gl.getUniformLocation(p, info.name); }
  return { p, u };
}
const progPoints = program(VS_POINTS, FS_POINTS);
const progBlur = program(VS_QUAD, FS_BLUR);
const progFinal = program(VS_QUAD, FS_FINAL);

/* ============================ 缓冲区 ============================ */
const vao = gl.createVertexArray();
gl.bindVertexArray(vao);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, buffer, gl.STATIC_DRAW);
const BYTES = STRIDE * 4;
[[0, 3, 0], [1, 3, 12], [2, 3, 24], [3, 4, 36]].forEach(([loc, n, off]) => {
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, n, gl.FLOAT, false, BYTES, off);
});
const emptyVao = gl.createVertexArray();

// 高动态范围的画布：亮的地方不会直接变成一片死白
let hdr = !!gl.getExtension('EXT_color_buffer_float') || !!gl.getExtension('EXT_color_buffer_half_float');
function makeTarget(w, h) {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  if (hdr) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
  else gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
  return { tex, fbo, w, h, ok };
}
function freeTarget(t) { gl.deleteTexture(t.tex); gl.deleteFramebuffer(t.fbo); }

let scene = null, levels = [];
let W = 0, HH = 0, dpr = 1;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(2, Math.floor(canvas.clientWidth * dpr)), h = Math.max(2, Math.floor(canvas.clientHeight * dpr));
  if (w === W && h === HH) return;
  W = w; HH = h; canvas.width = w; canvas.height = h;
  if (scene) freeTarget(scene);
  levels.forEach(l => { freeTarget(l.a); freeTarget(l.b); });
  scene = makeTarget(w, h);
  if (!scene.ok && hdr) { hdr = false; freeTarget(scene); scene = makeTarget(w, h); }
  levels = [];
  for (let i = 1; i <= 3; i++) {
    const lw = Math.max(2, w >> i), lh = Math.max(2, h >> i);
    levels.push({ a: makeTarget(lw, lh), b: makeTarget(lw, lh) });
  }
}

/* ============================ 矩阵 ============================ */
function perspective(fov, aspect, near, far) {
  const f = 1 / Math.tan(fov / 2), m = new Float32Array(16);
  m[0] = f / aspect; m[5] = f; m[10] = (far + near) / (near - far); m[11] = -1; m[14] = 2 * far * near / (near - far);
  return m;
}
function lookAt(e, t) {
  let zx = e[0] - t[0], zy = e[1] - t[1], zz = e[2] - t[2];
  let l = Math.hypot(zx, zy, zz); zx /= l; zy /= l; zz /= l;
  let xx = zz, xy = 0, xz = -zx;                    // up(0,1,0) × z
  l = Math.hypot(xx, xy, xz); xx /= l; xz /= l;
  const yx = zy * xz - zz * xy, yy = zz * xx - zx * xz, yz = zx * xy - zy * xx;
  return new Float32Array([xx, yx, zx, 0, xy, yy, zy, 0, xz, yz, zz, 0,
    -(xx * e[0] + xy * e[1] + xz * e[2]), -(yx * e[0] + yy * e[1] + yz * e[2]), -(zx * e[0] + zy * e[1] + zz * e[2]), 1]);
}
function matmul(a, b) {
  const o = new Float32Array(16);
  for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) {
    let s = 0; for (let k = 0; k < 4; k++) s += a[k * 4 + r] * b[c * 4 + k];
    o[c * 4 + r] = s;
  }
  return o;
}
// 世界坐标 → 屏幕坐标（0~1），第三个数是"是否在镜头前面"
function project(vp, x, y, z) {
  const cx = vp[0] * x + vp[4] * y + vp[8] * z + vp[12];
  const cy = vp[1] * x + vp[5] * y + vp[9] * z + vp[13];
  const cw = vp[3] * x + vp[7] * y + vp[11] * z + vp[15];
  return [cx / cw * 0.5 + 0.5, cy / cw * 0.5 + 0.5, cw > 0 ? 1 : 0];
}

/* ============================ 交互 ============================ */
const FOV = 40 * Math.PI / 180;
let yaw = 0.4, pitch = 0.3, dist = 23.5, vYaw = 0, vPitch = 0;
let form = 0, formTarget = 0;
let pointerX = 0, pointerY = 0, pointerLive = 0;
const pointers = new Map();
let pinch = 0;
const hint = document.getElementById('hint');
const hideHint = () => hint.classList.add('gone');

function toggleForm() {
  formTarget = formTarget > 0.5 ? 0 : 1;
  document.body.classList.toggle('formed', formTarget > 0.5);
  hint.textContent = formTarget > 0.5 ? '拖动旋转 · 滚轮缩放 · 双击化雪' : '双击，让雪重新聚成树';
  hint.classList.remove('gone');
  clearTimeout(hintTimer);
  if (formTarget > 0.5) hintTimer = setTimeout(hideHint, 12000);
}
let hintTimer = 0;
canvas.addEventListener('dblclick', toggleForm);
window.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); toggleForm(); } });

canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  canvas.classList.add('dragging');
  vYaw = vPitch = 0; pinch = 0;
});
canvas.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId);
  if (!p) {                                         // 没按下，只是划过：吹散粒子
    if (e.pointerType === 'mouse') {
      pointerX = e.clientX / canvas.clientWidth * 2 - 1;
      pointerY = 1 - e.clientY / canvas.clientHeight * 2;
      pointerLive = 1;
    }
    return;
  }
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  if (pointers.size === 1) {
    yaw -= dx * 0.006; pitch += dy * 0.005;
    vYaw = Math.max(-0.05, Math.min(0.05, -dx * 0.006));
    vPitch = Math.max(-0.03, Math.min(0.03, dy * 0.005));
    if (Math.abs(dx) + Math.abs(dy) > 2 && formTarget > 0.5) hideHint();
  } else if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinch > 0) dist *= pinch / Math.max(d, 1);
    pinch = d;
  }
});
function release(e) {
  pointers.delete(e.pointerId); pinch = 0;
  if (!pointers.size) canvas.classList.remove('dragging');
}
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', release);
canvas.addEventListener('wheel', e => { e.preventDefault(); dist *= Math.exp(e.deltaY * 0.0012); }, { passive: false });

/* ============================ 每一帧 ============================ */
const maxPoint = gl.getParameter(gl.ALIASED_POINT_SIZE_RANGE)[1];
const TARGET = [0, 4.7, 0];
let last = performance.now(), time = 0, spin = 0;
let cometQ = 0, pulseAt = -100;

const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

function drawQuad(prog, target, w, h) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, target);
  gl.viewport(0, 0, w, h);
  gl.useProgram(prog.p);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now; time += dt; spin += dt * CONFIG.spinSpeed;
  resize();

  // 聚合进度、松手后的惯性、鼠标"吹气"的余波
  const step = dt / 3.2;
  form = formTarget > form ? Math.min(formTarget, form + step) : Math.max(formTarget, form - step);
  if (!pointers.size) { yaw += vYaw; pitch += vPitch; vYaw *= 0.93; vPitch *= 0.86; }
  pitch = Math.min(1.05, Math.max(0.04, pitch));
  dist = Math.min(48, Math.max(10, dist));
  pointerLive *= Math.exp(-dt * 1.5);

  // 彗星：树完全成形后，一团金色的光沿着丝带爬上去；到顶时触发一次"心跳"
  let cometOn = 0;
  if (form >= 1) {
    cometQ += dt * CONFIG.cometSpeed;
    if (cometQ >= 1) { cometQ -= 1; pulseAt = time; }
    cometOn = smooth(0, 0.03, cometQ) * (1 - smooth(0.97, 1, cometQ));
  } else cometQ = 0;
  const ct = 1 - Math.sqrt(1 - cometQ);
  const ca = TURNS * TAU * Math.pow(ct, 0.8), cr = R * Math.pow(1 - ct, 1.12) + 0.04;
  const hx = Math.cos(ca) * cr, hz = Math.sin(ca) * cr, cs = Math.cos(spin), sn = Math.sin(spin);
  const comet = [cs * hx + sn * hz, H * ct, -sn * hx + cs * hz];
  const pulseAge = time - pulseAt;

  // 相机：围着树转
  const aspect = W / HH;
  const dd = dist * Math.max(1, 0.62 / aspect);            // 竖屏时自动拉远，保证整棵树都在画面里
  const cp = Math.cos(pitch);
  const eye = [TARGET[0] + dd * cp * Math.sin(yaw), TARGET[1] + dd * Math.sin(pitch), TARGET[2] + dd * cp * Math.cos(yaw)];
  const vp = matmul(perspective(FOV, aspect, 0.1, 250), lookAt(eye, TARGET));

  // 1) 把所有粒子画进高动态范围画布（先画倒影，再画本体）
  gl.bindFramebuffer(gl.FRAMEBUFFER, scene.fbo);
  gl.viewport(0, 0, W, HH);
  gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.disable(gl.DEPTH_TEST);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
  gl.useProgram(progPoints.p);
  const u = progPoints.u;
  gl.uniformMatrix4fv(u.uVP, false, vp);
  gl.uniform4f(u.uComet, comet[0], comet[1], comet[2], cometOn);
  gl.uniform3f(u.uPointer, pointerX, pointerY, pointerLive);
  gl.uniform3fv(u.uGold, C.gold);
  gl.uniform1f(u.uTime, time);
  gl.uniform1f(u.uForm, form);
  gl.uniform1f(u.uSpin, spin);
  gl.uniform1f(u.uCometQ, cometQ);
  gl.uniform1f(u.uPulseAge, pulseAge);
  gl.uniform1f(u.uAspect, aspect);
  gl.uniform1f(u.uDist, dd);
  gl.uniform1f(u.uPx, HH / (2 * Math.tan(FOV / 2)));
  gl.uniform1f(u.uGain, hdr ? 1 : 0.3);
  gl.uniform1f(u.uMaxPt, Math.min(maxPoint, 34 * dpr));
  gl.bindVertexArray(vao);
  const gloss = form * form * (1 - 0.85 * smooth(0.2, 0.75, pitch));   // 俯视时倒影变淡；化雪时没有倒影
  if (gloss > 0.01) { gl.uniform1f(u.uMirror, gloss); gl.drawArrays(gl.POINTS, 0, TREE_COUNT); }
  gl.uniform1f(u.uMirror, 0); gl.drawArrays(gl.POINTS, 0, COUNT);

  // 2) 逐级缩小并模糊，得到三层光晕
  gl.disable(gl.BLEND);
  gl.bindVertexArray(emptyVao);
  gl.useProgram(progBlur.p);
  gl.activeTexture(gl.TEXTURE0);
  gl.uniform1i(progBlur.u.uTex, 0);
  let src = scene.tex;
  for (const l of levels) {
    gl.bindTexture(gl.TEXTURE_2D, src);
    gl.uniform2f(progBlur.u.uDir, 0, 0);
    drawQuad(progBlur, l.a.fbo, l.a.w, l.a.h);
    gl.bindTexture(gl.TEXTURE_2D, l.a.tex);
    gl.uniform2f(progBlur.u.uDir, 1 / l.a.w, 0);
    drawQuad(progBlur, l.b.fbo, l.b.w, l.b.h);
    gl.bindTexture(gl.TEXTURE_2D, l.b.tex);
    gl.uniform2f(progBlur.u.uDir, 0, 1 / l.a.h);
    drawQuad(progBlur, l.a.fbo, l.a.w, l.a.h);
    src = l.a.tex;
  }

  // 3) 合成到屏幕
  const star = project(vp, 0, STAR_Y, 0), cm = project(vp, comet[0], comet[1], comet[2]);
  const formed = smooth(0.75, 1, form);
  gl.useProgram(progFinal.p);
  const f = progFinal.u;
  [scene.tex, levels[0].a.tex, levels[1].a.tex, levels[2].a.tex].forEach((t, i) => {
    gl.activeTexture(gl.TEXTURE0 + i); gl.bindTexture(gl.TEXTURE_2D, t);
  });
  gl.uniform1i(f.uScene, 0); gl.uniform1i(f.uB1, 1); gl.uniform1i(f.uB2, 2); gl.uniform1i(f.uB3, 3);
  gl.uniform3f(f.uStar, star[0], star[1], star[2] * formed * (0.55 + 0.1 * Math.sin(time * 2.1) + 2.2 * Math.exp(-pulseAge * 1.3)));
  gl.uniform3f(f.uCometS, cm[0], cm[1], cm[2] * cometOn);
  gl.uniform3fv(f.uGold, C.gold);
  gl.uniform1f(f.uAspect, aspect);
  gl.uniform1f(f.uExposure, CONFIG.exposure * (hdr ? 1 : 1 / 0.3));
  gl.uniform1f(f.uTime, time);
  drawQuad(progFinal, null, W, HH);

  requestAnimationFrame(frame);
}

resize();
requestAnimationFrame(frame);
// 开场：先是一场雪，然后雪聚成树
setTimeout(toggleForm, 1600);
</script>
</body>
</html>
