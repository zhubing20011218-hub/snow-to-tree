<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>雪落成树</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { font-family: -apple-system, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  canvas.dragging { cursor: grabbing; }

  .title {
    position: fixed; left: clamp(24px, 7vw, 110px); top: 50%; transform: translateY(-50%);
    pointer-events: none; user-select: none;
    opacity: 0; transition: opacity 3s ease;
  }
  .formed .title { opacity: 1; transition-delay: 1.2s; }
  .title h1 {
    margin: 0; font-weight: 400; font-style: italic; line-height: 1.2;
    font-family: "Didot", "Bodoni 72", "Playfair Display", "Times New Roman", Georgia, serif;
    font-size: clamp(22px, 2.9vw, 40px); letter-spacing: .01em;
    color: #f4e3c8;
  }
  .title p {
    margin: 14px 0 0; font-size: 11px; letter-spacing: .5em; color: rgba(255, 150, 190, .7);
  }
  @media (max-width: 760px) {
    .title { left: 0; right: 0; top: max(34px, env(safe-area-inset-top)); transform: none; text-align: center; }
    .title p { text-indent: .5em; }
  }

  .hint {
    position: fixed; left: 0; right: 0; bottom: max(22px, env(safe-area-inset-bottom));
    text-align: center; font-size: 11px; letter-spacing: .32em; text-indent: .32em;
    color: rgba(255, 255, 255, .34); pointer-events: none; user-select: none;
    transition: opacity 1.5s ease;
  }
  .hint.gone { opacity: 0; }

  #msg {
    position: fixed; left: 0; top: 0; pointer-events: none; white-space: nowrap;
    font-family: "Songti SC", "STSong", "Didot", "Times New Roman", serif;
    font-size: clamp(15px, 1.7vw, 20px); letter-spacing: .14em; color: #fff3dc;
    text-shadow: 0 0 14px #000, 0 0 5px #000, 0 0 22px rgba(255, 190, 90, .45);
    opacity: 0; transition: opacity .6s ease; will-change: transform;
  }
  #msg.on { opacity: 1; }

  /* 右下角的控制条：所有按钮都在这一个组件里，点最右边的圆钮可以整个收起 */
  .dock {
    position: fixed; right: clamp(12px, 2.4vw, 28px); bottom: max(14px, env(safe-area-inset-bottom));
    display: flex; align-items: center; justify-content: flex-end; gap: 8px; max-width: calc(100vw - 24px);
  }
  .dock-body {
    display: flex; align-items: center; flex-wrap: wrap; justify-content: flex-end; gap: 4px 16px;
    padding: 5px 16px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, .09);
    background: rgba(12, 12, 14, .6); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    transition: opacity .3s ease, transform .3s ease, visibility .3s;
  }
  .dock.closed .dock-body { opacity: 0; transform: translateX(14px); visibility: hidden; pointer-events: none; }
  .dock-body button {
    font: inherit; font-size: 11px; letter-spacing: .2em; color: rgba(255, 255, 255, .5);
    background: none; border: 0; padding: 6px 2px; cursor: pointer; transition: color .25s ease;
  }
  .dock-body button:hover { color: rgba(255, 255, 255, .95); }
  .dock-body .speed { display: flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: .2em; color: rgba(255, 255, 255, .5); }
  .dock-body input[type=range] { width: 92px; accent-color: #ffcf6b; cursor: pointer; }
  #dockToggle {
    flex: none; width: 30px; height: 30px; border-radius: 50%; padding: 0; cursor: pointer;
    font: inherit; font-size: 15px; line-height: 1; color: rgba(255, 255, 255, .6);
    background: rgba(12, 12, 14, .6); border: 1px solid rgba(255, 255, 255, .16);
    transition: opacity .3s ease, color .25s ease;
  }
  #dockToggle:hover { color: #fff; }
  .dock.closed #dockToggle { opacity: .4; }
  .dock.closed #dockToggle:hover { opacity: 1; }
  .dock button:focus-visible, .dock input:focus-visible { outline: 1px solid rgba(255, 207, 107, .8); outline-offset: 3px; }
  .clean .dock, .clean .hint, .clean #cam { display: none; }              /* 按 H：把按钮和提示全部藏起来 */
  @media (max-width: 760px) { .hint { bottom: max(64px, calc(env(safe-area-inset-bottom) + 52px)); } }

  .title, .hint, .dock, #msg { z-index: 10; }

  /* 照片：树成形时是挂在枝头的小礼物盒（画在 3D 里），散开时是玫红 / 金色的雪花 */
  #photos { position: fixed; inset: 0; z-index: 5; pointer-events: none; overflow: hidden; }
  .ph {
    position: absolute; left: 0; top: 0; width: 0; height: 0; padding: 0; border: 0; background: none;
    transform-origin: 0 0; pointer-events: none; opacity: 0; will-change: transform, opacity;
    --e: 1; color: #ff2f86;                 /* --e：0 = 礼物盒，1 = 雪花 */
  }
  .ph.gold { color: #ffcf6b; }
  .ph .disc { position: absolute; left: -23px; top: 0; width: 46px; height: 46px; opacity: 0; cursor: zoom-in; }   /* 礼物盒上方的透明点击区 */
  .ph .flake {
    position: absolute; left: -20px; top: -20px; width: 40px; height: 40px; opacity: var(--e); cursor: zoom-in;
    display: flex; align-items: center; justify-content: center;
  }
  .ph .flake svg { width: 17px; height: 17px; overflow: visible; filter: drop-shadow(0 0 3px currentColor) drop-shadow(0 0 9px currentColor); }
  .ph:focus-visible .disc, .ph:focus-visible .flake { outline: 2px solid #ffcf6b; outline-offset: 3px; }

  /* 点开之后：像一幅装裱好、打着灯的艺术照 */
  #lightbox {
    position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
    padding-bottom: 6vh; background: rgba(0, 0, 0, 0); transition: background .45s ease; cursor: zoom-out;
  }
  #lightbox[hidden] { display: none; }
  #lightbox:not(.on) { pointer-events: none; }     /* 正在淡出的时候不挡住后面的点击 */
  #lightbox.on { background: radial-gradient(ellipse 62% 52% at 50% 36%, rgba(255, 228, 186, .15), rgba(0, 0, 0, 0) 72%), rgba(0, 0, 0, .92); }
  .stage { animation: artFloat 7s ease-in-out infinite; }
  @keyframes artFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  #art {
    padding: 6px; border-radius: 2px; opacity: 0;
    background: linear-gradient(135deg, #f8e3a6, #b98a3c 28%, #fbeab6 52%, #a47628 78%, #f0d48f);   /* 细金框 */
    box-shadow: 0 34px 70px rgba(0, 0, 0, .75), 0 0 90px rgba(255, 205, 130, .14);
    -webkit-box-reflect: below 8px linear-gradient(rgba(0, 0, 0, 0) 70%, rgba(255, 255, 255, .17));  /* 像摆在光滑台面上的倒影 */
    transition: transform .65s cubic-bezier(.2, .8, .2, 1), opacity .3s ease;
  }
  #lightbox.on #art { opacity: 1; }
  .mat { background: #f6f0e4; padding: clamp(14px, 3.4vmin, 36px); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .1), inset 0 2px 10px rgba(0, 0, 0, .12); }   /* 卡纸留白 */
  #lbImg { display: block; max-width: min(66vw, 920px); max-height: 60vh; box-shadow: 0 0 0 1px rgba(0, 0, 0, .28), 0 1px 4px rgba(0, 0, 0, .3); }
  @media (prefers-reduced-motion: reduce) { .stage { animation: none; } }
  /* 主照片两侧错落摆开的其他照片 */
  .side {
    position: absolute; padding: 5px; border: 0; background: #f6f0e4; cursor: pointer; opacity: 0;
    box-shadow: 0 16px 34px rgba(0, 0, 0, .65); filter: brightness(.72);
    transition: opacity .5s ease .25s, filter .25s ease, transform .35s ease;
  }
  .side img { display: block; width: 100%; height: auto; pointer-events: none; }
  #lightbox.on .side { opacity: var(--o, .8); }
  .side:hover, .side:focus-visible { filter: brightness(1); outline: none; }
  .stage { position: relative; z-index: 20; }
  /* 有多张照片时，主照片小一点，给两侧的照片留出位置 */
  #lightbox.multi #lbImg { max-width: min(46vw, 760px); max-height: 56vh; }
  @media (max-width: 720px), (orientation: portrait) {
    #lightbox.multi { padding-bottom: 20vh; }
    #lightbox.multi #lbImg { max-width: 76vw; max-height: 42vh; }
    #lightbox.multi #art { -webkit-box-reflect: unset; }
  }

  /* 照片管理面板 */
  #panel {
    position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center;
    background: rgba(0, 0, 0, .6); padding: 16px;
  }
  #panel[hidden] { display: none; }
  .sheet {
    width: min(560px, 100%); max-height: min(78vh, 640px); display: flex; flex-direction: column;
    background: rgba(14, 14, 16, .94); border: 1px solid rgba(255, 255, 255, .09); border-radius: 14px;
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); color: #f4e3c8;
  }
  .sheet header { display: flex; align-items: baseline; gap: 12px; padding: 18px 20px 12px; }
  .sheet h2 { margin: 0; font-size: 15px; font-weight: 500; letter-spacing: .3em; }
  .sheet header span { font-size: 11px; color: rgba(255, 255, 255, .4); letter-spacing: .1em; }
  .sheet header button { margin-left: auto; font: inherit; font-size: 12px; letter-spacing: .2em; color: rgba(255, 255, 255, .6); background: none; border: 0; cursor: pointer; padding: 6px; }
  .sheet header button:hover { color: #fff; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 10px; padding: 4px 20px 16px; overflow-y: auto; }
  .tile { position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: #0a0a0a; border: 1px solid rgba(255, 255, 255, .08); }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile .acts { position: absolute; left: 0; right: 0; bottom: 0; display: flex; background: rgba(0, 0, 0, .62); }
  .tile .acts button, .tile .tag { flex: 1; font: inherit; font-size: 11px; letter-spacing: .12em; color: rgba(255, 255, 255, .82); background: none; border: 0; padding: 7px 0; cursor: pointer; text-align: center; }
  .tile .acts button:hover { color: #ffcf6b; }
  .tile .acts button + button { border-left: 1px solid rgba(255, 255, 255, .12); }
  .tile .tag { cursor: default; color: rgba(255, 255, 255, .45); }
  .tile.add { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font: inherit; font-size: 12px; letter-spacing: .14em; color: rgba(255, 207, 107, .9); border: 1px dashed rgba(255, 207, 107, .5); background: rgba(255, 207, 107, .04); cursor: pointer; }
  .tile.add:hover { background: rgba(255, 207, 107, .1); }
  .tile.add b { font-size: 26px; font-weight: 300; line-height: 1; }
  .sheet footer { padding: 12px 20px 18px; font-size: 11px; line-height: 1.8; color: rgba(255, 255, 255, .42); border-top: 1px solid rgba(255, 255, 255, .06); }
  .sheet button:focus-visible, .tile.add:focus-visible { outline: 1px solid #ffcf6b; outline-offset: 2px; }

  /* 手势：左下角的小摄像头画面 */
  #cam {
    position: fixed; left: clamp(14px, 3vw, 34px); bottom: max(18px, env(safe-area-inset-bottom)); z-index: 10;
    width: 132px; height: 99px; object-fit: cover; transform: scaleX(-1); border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, .14); opacity: 0; pointer-events: none; transition: opacity .5s ease;
  }
  #cam.on { opacity: .55; }
  @media (max-width: 760px) { #cam { bottom: 96px; width: 96px; height: 72px; } }

  #fallback {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: 24px; text-align: center; line-height: 1.8; color: #f4e3c8;
  }
  #fallback[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div class="title">
  <h1 id="titleText"></h1>
  <p id="subText"></p>
</div>

<div id="msg"></div>
<div class="hint gone" id="hint"></div>
<div id="photos"></div>
<video id="cam" playsinline muted></video>
<div class="dock" id="dock">
  <div class="dock-body" id="dockBody">
    <label class="speed"><span>烟花速度</span><input type="range" id="speed" min="0.03" max="0.5" step="0.01" aria-label="烟花从树底到树顶的速度"></label>
    <button id="gestureBtn" type="button">手势</button>
    <button id="photoBtn" type="button">照片</button>
    <button id="soundBtn" type="button">声音 开</button>
    <button id="resetBtn" type="button">重新装饰</button>
  </div>
  <button id="dockToggle" type="button" aria-controls="dockBody" aria-label="收起或展开按钮"></button>
</div>

<div id="lightbox" hidden><div id="sides"></div><div class="stage"><div id="art"><div class="mat"><img id="lbImg" alt=""></div></div></div></div>

<div id="panel" hidden>
  <div class="sheet" role="dialog" aria-label="照片">
    <header><h2>照片</h2><span id="photoCount"></span><button id="panelClose" type="button">完成</button></header>
    <div id="grid"></div>
    <footer>每张照片会变成一个挂在树上的小礼物盒；树散开时，它们是玫红和金色的雪花。点一下就能放大。<br>照片只保存在这台电脑的这个浏览器里，不会上传到任何地方。</footer>
  </div>
</div>
<input type="file" id="file" accept="image/*" multiple hidden>

<div id="fallback" hidden>这个浏览器不支持 WebGL2，请换用新版 Chrome、Edge 或 Safari 打开。</div>

<script>
'use strict';

/* =====================================================================
   可以自己改的地方（改完保存，刷新浏览器就能看到）
   ===================================================================== */
const CONFIG = {
  title: 'Merry Christmas,',         // 左边的标题
  subtitle: 'FOR YOU',               // 标题下面的小字，可以改成她的名字

  messages: [],                      // 想在树上藏几句话时再填，例如 ['圣诞快乐']：每句话是一盏金灯，点一下显示

  photos: [],                        // 想把照片和网页一起发给别人时用：把照片放进 photos 文件夹，在这里写 ['photos/1.jpg', 'photos/2.jpg']
                                     // 平时不用填，直接点页面右下角的「照片」按钮添加就行

  colors: {                          // 颜色（网页常用的 #十六进制 写法）
    rose:     '#ff2f86',             // 玫红（主色）
    deepRose: '#c2185b',             // 深玫红
    blush:    '#ffb3cf',             // 浅粉
    gold:     '#ffcf6b',             // 金色
    green:    '#2fbf7a',             // 绿叶
    deepGreen:'#0e6b47'              // 深绿
  },

  counts: {                          // 粒子数量（电脑卡顿就把数字调小）
    ribbon: 34000,                   // 绕着树的玫红色光带
    thread: 20000,                   // 反方向缠绕的金色光带
    dust: 5000,                      // 树身周围的浮尘
    bulbs: 220,                      // 树上的小暖灯
    seeds: 16000,                    // 藏在枝叶里的"雪种"：树散开时飘出去的雪
    snow: 6500                       // 雪
  },

  ornaments: 0.55,                   // 有多少树枝的枝头挂装饰（0 = 不挂，1 = 每根都挂）
  snowOnTree: 0.45,                  // 枝叶上的积雪（0 = 没有，1 = 很多）

  spinSpeed: 0.2,                    // 树自转速度（0 = 不转）
  bandWidth: 1.0,                    // 两条光带的粗细（1 = 默认，2 = 粗一倍）
  cometSpeed: 0.1,                   // 烟花（那团金色的光）从树底爬到树顶的速度；页面右下角也有滑块可以调
  exposure: 1.0                      // 整体亮度
};

/* ============================ 基础工具 ============================ */
const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, powerPreference: 'high-performance' });
document.getElementById('titleText').textContent = CONFIG.title;
document.getElementById('subText').textContent = CONFIG.subtitle;

if (!gl) {
  document.getElementById('fallback').hidden = false;
  throw new Error('WebGL2 not supported');
}

const rand = Math.random;
const TAU = Math.PI * 2;
const gauss = () => (rand() + rand() + rand() + rand() - 2) / 2;   // 中间密、两边稀的随机数

// 把 #rrggbb 转成线性空间的 RGB（渲染最后会统一做一次色调映射）
function hex(h) {
  const n = parseInt(h.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(v => Math.pow(v / 255, 2.2));
}
const C = {};
for (const k in CONFIG.colors) C[k] = hex(CONFIG.colors[k]);
const mixc = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const mul = (a, s) => [a[0] * s, a[1] * s, a[2] * s];

/* ============================ 生成粒子 ============================ */
// 每个粒子 13 个数字：位置(3) 化成雪时的位置(3) 颜色(3) 大小 相位 类型 附加值
const H = 10, R = 3.8, TURNS = 5, STAR_Y = 10.25, PHOTO_SLOTS = 24;
const SNOW_W = 60, SNOW_H = 25;          // 下雪的范围（宽 × 高）
const data = [];

function add(x, y, z, col, size, type, extra) {
  data.push(x, y, z, (rand() - 0.5) * SNOW_W, rand() * SNOW_H, (rand() - 0.5) * SNOW_W,
            col[0], col[1], col[2], size, rand(), type, extra || 0);
}

// ---- 先放"属于树"的粒子（它们会有倒影，也会化成雪） ----

// 0 = 玫红螺旋丝带。位置里存的是：在丝带上的进度、离丝带中线的横向偏移、纵向偏移
for (let i = 0; i < CONFIG.counts.ribbon; i++) {
  const stray = rand() < 0.2 ? 2.4 : 1;                 // 少量粒子飘得更散，像扬起的雪粉
  const k = rand();
  let col = k < 0.62 ? mixc(C.rose, C.blush, rand() * 0.7) : k < 0.84 ? mixc(C.blush, [1, 1, 1], rand() * 0.5) : C.gold;
  const gain = (0.24 + Math.pow(rand(), 2) * 1.0) / (stray > 1 ? 1.6 : 1);
  add(rand(), gauss() * stray, gauss() * stray, mul(col, gain), 0.036 + Math.pow(rand(), 3) * 0.07, 0);
}
// 1 = 圆锥形的浮尘，让轮廓更像一棵树
for (let i = 0; i < CONFIG.counts.dust; i++) {
  const t = 1 - Math.sqrt(1 - rand() * 0.98), ang = rand() * TAU;
  const rr = (R * Math.pow(1 - t, 1.12) + 0.05) * Math.sqrt(rand()) * 1.08;
  add(Math.cos(ang) * rr, H * t, Math.sin(ang) * rr, mul(mixc(C.deepRose, C.blush, rand()), 0.26), 0.025 + rand() * 0.03, 1);
}
// 树的骨架：十五层树枝。实体的枝叶、装饰、小灯和"雪种"都沿着这些树枝摆放
const BOUGHS = [];
for (let k = 0, TIERS = 15; k < TIERS; k++) {
  const tt = k / (TIERS - 1), y0 = 0.95 + tt * 8.45;
  const len0 = R * Math.pow(1 - y0 / H, 1.08) + 0.1, nb = Math.round(15 - 9 * tt);
  for (let j = 0; j < nb; j++) {
    const ang = (j + (k % 2) * 0.5) / nb * TAU + (rand() - 0.5) * 0.3;
    BOUGHS.push({ ang, ca: Math.cos(ang), sa: Math.sin(ang), y0, len: len0 * (0.85 + rand() * 0.25), droop: 0.3 + rand() * 0.16, tier: tt });
  }
}
const boughY = (b, sd) => b.y0 + 0.1 * b.len * sd - b.droop * b.len * sd * sd;   // 树枝先微微上扬，再往下垂
const boughSlope = (b, sd) => 0.1 - 2 * b.droop * sd;
const boughPoint = (b, sd, lift) => [b.ca * sd * b.len, boughY(b, sd) + (lift || 0), b.sa * sd * b.len];
const anyBough = () => BOUGHS[(rand() * BOUGHS.length) | 0];

// 1 = "雪种"：平时藏在枝叶里看不见（颜色是 0），树散开时它们就是飘出去的雪
for (let i = 0; i < CONFIG.counts.seeds; i++) {
  const p = boughPoint(anyBough(), Math.sqrt(rand()), gauss() * 0.15);
  add(p[0], p[1], p[2], [0, 0, 0], 0.03 + rand() * 0.05, 1);
}
// 枝头亮晶晶的霜粒
for (let i = 0, n = Math.floor(6000 * CONFIG.snowOnTree); i < n; i++) {
  const b = anyBough(), p = boughPoint(b, 0.45 + rand() * 0.6, 0.1 + rand() * 0.15), j = gauss() * 0.3;
  add(p[0] - b.sa * j, p[1], p[2] + b.ca * j, mul(mixc(C.blush, [1, 1, 1], 0.85), 0.25 + rand() * 0.4), 0.025 + rand() * 0.03, 1);
}
// 小暖灯（附加值 2 = 画成一颗会一明一暗的小灯泡）
const WARM = hex('#ffd9a0');
for (let i = 0; i < CONFIG.counts.bulbs; i++) {
  const b = anyBough(), p = boughPoint(b, 0.55 + rand() * 0.5, -0.1), k = rand();
  add(p[0] + b.ca * 0.2, p[1], p[2] + b.sa * 0.2, mul(k < 0.74 ? WARM : k < 0.9 ? C.rose : C.blush, 1.5), 0.46 + rand() * 0.22, 1, 2);

const VS_POINTS = `#version 300 es

// 螺旋丝带：q 是沿着丝带走了多远（0 = 地面，1 = 树尖）
vec3 helix(float q, float dir, float jr, float jy, float wScale, out float t) {
  t = 1.0 - sqrt(1.0 - q);
  float ang = dir * TURNS * 6.2831853 * pow(t, 0.8);

  float w = (0.11 + 0.36 * (1.0 - t)) * wScale * uBand;
  float rr = r + jr * w;
  return vec3(cos(ang) * rr, H * t + jy * w * 0.5, sin(ang) * rr);

// 雪的飘落：一边下落，一边被风吹着横移、左右摇摆
vec3 snowfall(vec3 s, float ph, out float edge) {
  vec3 p = s;
  p.y = mod(s.y - uTime * (0.5 + ph * 0.9), SNOW_H) - 3.0;
  p.x = mod(s.x + uTime * 0.28 * (0.5 + ph) + SNOW_W * 0.5, SNOW_W) - SNOW_W * 0.5 + sin(uTime * 0.35 + ph * 40.0) * 0.6;
  p.z = s.z + cos(uTime * 0.3 + ph * 31.0) * 0.6;
  edge = smoothstep(-3.0, 0.5, p.y) * (1.0 - smoothstep(SNOW_H - 6.0, SNOW_H - 3.0, p.y))

  return p;
}

void main() {
  float size = aData.x, ph = aData.y, type = aData.z, ex = aData.w;
  vec3 p = aPos, col = aColor;
  float bright = 1.0, alpha = 1.0;
  bool tree = type < 3.5;
  float leaf = (type > 0.5 && type < 1.5 && ex > 0.5) ? 1.0 : 0.0;

  if (tree) {
    float q = 0.0, t = 0.0;
    if (type < 0.5) {                    // 玫红丝带：粒子缓缓向上流动
      q = fract(aPos.x + uTime * 0.010);
      p = helix(q, 1.0, aPos.y, aPos.z, 1.0, t);
      bright = smoothstep(0.0, 0.02, q) * (1.0 - smoothstep(0.985, 1.0, q));
      col = mix(col, uGold * 0.8, smoothstep(0.7, 1.0, t) * 0.65);
    } else if (type < 1.5) {             // 浮尘
      p = aPos;
    } else if (type < 2.5) {             // 金线
      q = fract(aPos.x + uTime * 0.018);
      p = helix(q, -1.0, aPos.y, aPos.z, 0.42, t);
      bright = smoothstep(0.0, 0.02, q) * (1.0 - smoothstep(0.985, 1.0, q));
    } else {                             // 彗星
      q = uCometQ - aPos.x;
      p = helix(clamp(q, 0.0, 0.999), 1.0, aPos.y, aPos.z, 0.3, t);
      bright = step(0.0, q) * uComet.w * (exp(-aPos.x * 60.0) * 3.5 + 0.35);

    p.xz = rot(uSpin) * p.xz;

    if (type < 2.5) {
      // 闪烁
      float tw = 0.7 + 0.3 * sin(uTime * (1.2 + ph * 2.5) + ph * 40.0);
      float sp = pow(max(sin(uTime * (0.7 + ph * 1.6) + ph * 97.0), 0.0), 30.0) * 3.0;
      bright *= tw + sp;

      // 彗星经过时把附近照成金色，身后留下一条慢慢熄灭的光带
      vec3 dv = p - uComet.xyz;
      float g = uComet.w * exp(-dot(dv, dv) * 0.5);
      float tail = 0.0;
      if (type < 0.5) { float dq = uCometQ - q; tail = dq > 0.0 ? exp(-dq * 24.0) * uComet.w : 0.0; }
      col = mix(col, uGold, clamp(g * 1.2 + tail, 0.0, 1.0));
      bright *= 1.0 + 3.2 * g + 1.7 * tail;

      // 聚合 / 化雪：没聚合的时候，这些粒子就是漫天的雪

      f = f * f * (3.0 - 2.0 * f);
      if (f < 1.0) {
        float edge;
        vec3 s = snowfall(aScatter, ph, edge);
        p = mix(s, p, f);
        col = mix(vec3(0.85, 0.82, 0.84), col, f);
        bright = mix(0.6 * edge * step(0.7, fract(ph * 7.13)) * (1.0 - leaf), bright, f);

    float edge;
    p = snowfall(aPos, ph, edge);
    bright = 0.5 * edge;
  } else if (type < 5.5) {               // 涟漪：一圈圈的光点，彗星到顶时会有一道金色的波纹荡开

    p.xz = rot(uTime * 0.025 * (mod(ex, 2.0) < 0.5 ? 1.0 : -1.0)) * aPos.xz;
    float wave = sin(r * 1.7 - uTime * 1.1);
    float pulse = exp(-pow((r - uPulseAge * 3.4) / 0.8, 2.0)) * exp(-uPulseAge * 0.45);
    p.y = wave * 0.05 * smoothstep(0.0, 3.0, r) + pulse * 0.3;
    float arc = smoothstep(-0.35, 0.25, sin(a + ex * 2.4 + uTime * 0.03) + 0.4 * sin(a * 3.0 - ex * 1.3));

    col = mix(col, uGold, clamp(pulse * 1.4, 0.0, 1.0));
  } else if (type < 6.5) {               // 树尖喷出的雪屑
    float age = uPulseAge;
    float tt = (1.0 - exp(-age * 1.1)) / 1.1;
    p = vec3(0.0, STAR_Y, 0.0) + aPos * tt * 1.8 + vec3(sin(age * 0.8 + ph * 20.0) * 0.15 * age, -0.12 * age * age, 0.0);
    bright = exp(-age * 0.5) * (0.5 + 0.9 * pow(0.5 + 0.5 * sin(uTime * 6.0 + ph * 50.0), 4.0)) * 1.3 * step(age, 20.0);
  } else {                               // 挂在树上的灯：被敲响或彗星经过时会亮一下
    p.xz = rot(uSpin) * aPos.xz;
    float flare = exp(-max(uTime - ex, 0.0) * 2.2);
    vec3 dv = p - uComet.xyz;
    float g = uComet.w * exp(-dot(dv, dv) * 0.8);
    bright = (0.72 + 0.28 * sin(uTime * 1.6 + ph * 30.0)) * (1.0 + 2.6 * flare + 1.4 * g) * smoothstep(0.85, 1.0, uForm);
    size *= 1.0 + 0.7 * flare;
  }

  if (uMirror > 0.0) {                   // 倒影：上下翻转，越高的地方越淡
    alpha = 0.16 * uMirror * exp(-max(p.y, 0.0) * 0.22);
    p.y = -p.y;
  }

  vec4 clip = uVP * vec4(p, 1.0);

  // 鼠标划过的地方，粒子像被吹了一口气一样散开
  vec2 nd = clip.xy / max(clip.w, 0.001);
  vec2 dv = (nd - uPointer.xy) * vec2(uAspect, 1.0);
  float dd = dot(dv, dv);
  float push = uPointer.z * exp(-dd * 24.0) * (0.3 + 1.4 * ph);

  else if (leaf > 0.5) { shape = 2.0; bright *= 0.7 + 0.5 * sin(uTime * (0.8 + ph * 2.2) + ph * 60.0); }   // 小暖灯：一明一暗

    shape = 1.0;
    bright *= pow(12.0 / px, 2.0) * (1.0 - smoothstep(uMaxPt * 0.55, uMaxPt, px));
  }
  gl_PointSize = clamp(px, 1.5, uMaxPt);
  vColor = col * bright * alpha * min(1.0, px / 1.5) * uGain;
  vShape = shape;
  vRot = 0.0;
}`;

const FS_POINTS = `#version 300 es

in vec3 vColor;
flat in float vShape;
flat in float vRot;

  if (scene) freeTarget(scene);
  levels.forEach(l => { freeTarget(l.a); freeTarget(l.b); });
  scene = makeTarget(w, h, true);
  if (!scene.ok && hdr) { hdr = false; freeTarget(scene); scene = makeTarget(w, h, true); }
  levels = [];
  for (let i = 1; i <= 3; i++) {
    const lw = Math.max(2, w >> i), lh = Math.max(2, h >> i);

/* ============================ 矩阵 ============================ */
function perspective(fov, aspect, near, far) {

  return m;
}

  let xx = zz, xy = 0, xz = -zx;                    // up(0,1,0) × z
  l = Math.hypot(xx, xy, xz); xx /= l; xz /= l;
  const yx = zy * xz - zz * xy, yy = zz * xx - zx * xz, yz = zx * xy - zy * xx;
  return new Float32Array([xx, yx, zx, 0, xy, yy, zy, 0, xz, yz, zz, 0,
    -(xx * e[0] + xy * e[1] + xz * e[2]), -(yx * e[0] + yy * e[1] + yz * e[2]), -(zx * e[0] + zy * e[1] + zz * e[2]), 1]);

}
// 世界坐标 → 屏幕坐标（0~1），第三个数是"是否在镜头前面"
function project(vp, x, y, z) {
  const cx = vp[0] * x + vp[4] * y + vp[8] * z + vp[12];
  const cy = vp[1] * x + vp[5] * y + vp[9] * z + vp[13];
  const cw = vp[3] * x + vp[7] * y + vp[11] * z + vp[15];
  return [cx / cw * 0.5 + 0.5, cy / cw * 0.5 + 0.5, cw > 0 ? 1 : 0];

/* ============================ 交互 ============================ */
const FOV = 40 * Math.PI / 180;
let yaw = 0.4, pitch = 0.3, dist = 23.5, vYaw = 0, vPitch = 0;

const coneR = y => R * Math.pow(Math.max(0, 1 - y / H), 1.12) * 1.08 + 0.3;   // 树在某个高度的半径（枝叶的外沿）
const LIGHT_COLORS = [mul(C.rose, 1.2), mixc(C.blush, [1, 1, 1], 0.45), mixc(C.gold, [1, 1, 1], 0.25)];
const MAX_USER_LIGHTS = 46;

// 把用户挂的灯记在浏览器里，下次打开还在（浏览器不让存的时候就不记，不影响使用）
const store = {
  get(k, d) { try { const v = localStorage.getItem('snowtree.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('snowtree.' + k, JSON.stringify(v)); } catch (e) {} }
};

const lights = [];
function makeLight(x, y, z, k, msg) {
  return { x, y, z, k, msg: msg || '', col: msg ? mul(C.gold, 1.2) : LIGHT_COLORS[k % 3], size: msg ? 0.95 : 0.7, ph: rand(), ring: -100, heard: -100 };
}
// 带留言的金灯：沿着树身均匀地盘旋排开
CONFIG.messages.slice(0, 16).forEach((m, i, arr) => {
  const y = 1.3 + (i + 0.5) / arr.length * 7.2, a = i * 2.39996 + 0.6, r = Math.max(0.1, coneR(y) - 0.08);
  lights.push(makeLight(Math.cos(a) * r, y, Math.sin(a) * r, 2, m));
});
const PRESET_COUNT = lights.length;
store.get('lights', []).slice(0, MAX_USER_LIGHTS).forEach(l => {

function saveLights() {
  store.set('lights', lights.slice(PRESET_COUNT).map(l => ({ x: +l.x.toFixed(3), y: +l.y.toFixed(3), z: +l.z.toFixed(3), k: l.k })));
}
// 灯跟着树一起转：算出它此刻在世界里的位置
function lightWorld(l) {
  const c = Math.cos(spin), s = Math.sin(spin);
  return [c * l.x + s * l.z, l.y, -s * l.x + c * l.z];
}

// ---- 声音：每盏灯是一个音符，挂得越高音越高（五声音阶，怎么排都好听） ----
let audio = null, master = null, soundOn = store.get('sound', true);

  delay.delayTime.value = 0.31; fb.gain.value = 0.32; wet.gain.value = 0.3;

const SCALE = [0, 2, 4, 7, 9];
function noteFor(y) {
  const n = Math.max(0, Math.min(14, Math.floor(y / H * 15)));
  return 261.63 * Math.pow(2, (SCALE[n % 5] + 12 * Math.floor(n / 5)) / 12);
}
function ringLight(l, vol) { l.ring = time; chime(noteFor(l.y), vol); }

// ---- 点击：点到了哪盏灯？点到了树的哪里？ ----
let camVP = null, camEye = [0, 0, 1], camDist = 20;
function pickLight(cx, cy) {
  if (!camVP) return null;
  let best = null, bestD = 26;
  for (const l of lights) {
    const w = lightWorld(l), pr = project(camVP, w[0], w[1], w[2]);
    if (!pr[2]) continue;
    const d = Math.hypot(pr[0] * canvas.clientWidth - cx, (1 - pr[1]) * canvas.clientHeight - cy);
    if (d < bestD) { bestD = d; best = l; }

}
function pickTree(cx, cy) {

  const th = Math.tan(FOV / 2), aspect = canvas.clientWidth / canvas.clientHeight;
  const nx = (cx / canvas.clientWidth * 2 - 1) * th * aspect, ny = (1 - cy / canvas.clientHeight * 2) * th;
  let fx = TARGET[0] - camEye[0], fy = TARGET[1] - camEye[1], fz = TARGET[2] - camEye[2];
  let l = Math.hypot(fx, fy, fz); fx /= l; fy /= l; fz /= l;
  let rx = -fz, rz = fx; l = Math.hypot(rx, rz); rx /= l; rz /= l;
  const ux = -rz * fy, uy = rz * fx - rx * fz, uz = rx * fy;

  l = Math.hypot(dx, dy, dz); dx /= l; dy /= l; dz /= l;
  for (let t = Math.max(0.5, camDist - 9); t < camDist + 9; t += 0.04) {
    const x = camEye[0] + dx * t, y = camEye[1] + dy * t, z = camEye[2] + dz * t;
    if (y > 0.3 && y < H - 0.15 && Math.hypot(x, z) < coneR(y) + 0.06) {
      const c = Math.cos(spin), s = Math.sin(spin);
      return [c * x - s * z, y, s * x + c * z];                       // 换算回"树自己的坐标"，这样灯会跟着树转
    }
  }
  return null;
}

const msgEl = document.getElementById('msg');
let msgLight = null, msgUntil = 0;
function handleTap(cx, cy) {
  ensureAudio();

  const l = pickLight(cx, cy);
  if (l) {                                                             // 点到一盏灯：敲响它；有留言就显示出来

    return;

  const nl = makeLight(hit[0], hit[1], hit[2], (lights.length - PRESET_COUNT) % 3);
  lights.push(nl); saveLights(); ringLight(nl, 0.9);
}

/* ============================ 照片 ============================ */
// 照片用普通的网页图片来显示（而不是画进 3D 画布），这样直接双击打开网页也能正常加载；
// 每一帧根据它在 3D 空间里的位置，算出它在屏幕上该出现在哪、该多大。
const photoBox = document.getElementById('photos'), lightbox = document.getElementById('lightbox'), lbImg = document.getElementById('lbImg');
const panel = document.getElementById('panel'), grid = document.getElementById('grid'), fileEl = document.getElementById('file');
const MAX_PHOTOS = PHOTO_SLOTS, PHOTO_GIFT = 0.8;     // 照片礼物盒的大小
const photos = [];                       // { url, key, locked, placeholder, el, tilt, depth }

// 浏览器自带的小数据库，用来把用户添加的照片存下来（存不了也没关系，只是刷新后要重新加）
const db = {
  h: null,
  open() {
    return new Promise(res => {
      try {
        const r = indexedDB.open('snowtree', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('photos', { keyPath: 'id', autoIncrement: true });
        r.onsuccess = () => { db.h = r.result; res(true); };
        r.onerror = () => res(false);
      } catch (e) { res(false); }
    });
  },
  run(mode, fn) {
    return new Promise(res => {
      if (!db.h) return res(null);
      try {
        const tx = db.h.transaction('photos', mode), rq = fn(tx.objectStore('photos'));
        tx.oncomplete = () => res(rq ? rq.result : null);
        tx.onerror = tx.onabort = () => res(null);
      } catch (e) { res(null); }
    });
  },
  all() { return db.run('readonly', s => s.getAll()); },
  add(blob) { return db.run('readwrite', s => s.add({ blob })); },
  put(id, blob) { return db.run('readwrite', s => s.put({ id, blob })); },
  del(id) { return db.run('readwrite', s => s.delete(id)); }
};

// 把手机 / 相机拍的大图缩小到合适的尺寸再保存，省空间也更流畅
function fileToBlob(file) {
  return new Promise(res => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1400 / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.naturalWidth * k)); c.height = Math.max(1, Math.round(img.naturalHeight * k));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => res(b), 'image/jpeg', 0.86);
    };
    img.onerror = () => { URL.revokeObjectURL(url); res(null); };   // 浏览器打不开的格式（比如部分 HEIC）就跳过
    img.src = url;
  });
}

const realPhotos = () => photos.filter(p => !p.placeholder);

// 一片六角雪花的图案（散开时照片的样子）

  + [0, 60, 120, 180, 240, 300].map(a => '<path transform="rotate(' + a + ')" d="M0 0V-10.5M0 -6.2l-2.7 -2.3M0 -6.2l2.7 -2.3"/>').join('')
  + '</g><circle r="1.7" fill="#fff"/></svg>';

// 根据照片列表，重新生成树上的礼物盒和散开时的雪花。没有照片时，树上什么都不多挂
function syncPhotos() {

    probe.onload = () => { ph.aspect = probe.naturalWidth / Math.max(1, probe.naturalHeight); };

  for (let i = 0; i < PHOTO_SLOTS; i++) {
    const o = (STATIC_CARDS + i) * CARD_STRIDE;

}

// ---- 「照片」面板：添加、替换、删除 ----

async function removePhoto(ph) {

}

// ---- 点照片放大：从它原来的位置"飞"到灯光下，像一幅装裱好的艺术照 ----
const art = document.getElementById('art');
let lbIndex = -1;
function openLightbox(i, from) {
  const ph = photos[i];

  if (ph.placeholder) { openPanel(); return; }
  lbIndex = i; lightbox.hidden = false; lightbox.classList.remove('on');
  lightbox.classList.toggle('multi', realPhotos().length > 1);
  art.style.transition = 'none'; art.style.transform = '';
  const start = () => {
    const b = art.getBoundingClientRect();

    }

}

function stepLightbox(dir) {
  const real = photos.map((p, i) => p.placeholder ? -1 : i).filter(i => i >= 0);
  if (real.length < 2) return;

}

// 艺术排列：主照片装框居中，前后几张照片像展墙上的小幅作品一样，高低错落、微微倾斜地摆在两侧
const sideBox = document.getElementById('sides');
function layoutSides(fr) {
  sideBox.textContent = '';
  const real = photos.map((p, i) => p.placeholder ? -1 : i).filter(i => i >= 0);
  const pos = real.indexOf(lbIndex);
  if (pos < 0 || real.length < 2 || !fr.width) return;
  const vw = window.innerWidth, vh = window.innerHeight;
  const narrow = vw < 720 || vw < vh;                                   // 手机竖屏：两侧放不下，改成摆在主照片下面
  const base = narrow ? vh * 0.15 : Math.min(fr.height * 0.48, vh * 0.3);
  const used = new Set([pos]);
  [-1, 1].forEach(side => {
    let edge = narrow ? vw / 2 : (side < 0 ? fr.left : fr.right);
    for (let k = 1; k <= 3; k++) {
      const idx = ((pos + side * k) % real.length + real.length) % real.length;
      if (used.has(idx)) break;
      const ph = photos[real[idx]], h = base * (1 - 0.13 * (k - 1)), w = h * Math.min(1.6, Math.max(0.6, ph.aspect || 0.8));
      // 第一张有一小部分藏在主画框后面，后面的再依次叠出去，像随手摆开的一组作品
      const cx = edge + side * (w * 0.5 - (narrow ? (k === 1 ? -4 : w * 0.18) : w * 0.2));
      if (cx - w / 2 < -w * 0.45 || cx + w / 2 > vw + w * 0.45) break;   // 屏幕放不下就不摆了
      used.add(idx); edge = cx + side * w * 0.5;
      const cy = narrow ? fr.bottom + h * 0.62 + (k % 2 ? 0 : h * 0.12)
                        : fr.top + fr.height * (k % 2 ? 0.33 : 0.7) + side * vh * 0.015;
      const el = document.createElement('button'), im = document.createElement('img');
      el.type = 'button'; el.className = 'side'; el.setAttribute('aria-label', '看这张照片');
      im.src = ph.url; im.alt = ''; el.appendChild(im);
      el.style.cssText = 'left:' + (cx - w / 2).toFixed(1) + 'px;top:' + (cy - h / 2).toFixed(1) + 'px;width:' + w.toFixed(1) + 'px;z-index:' + (10 - k)
        + ';transform:rotate(' + (side * (k % 2 ? -4 : 5) - 1).toFixed(1) + 'deg);--o:' + (0.86 - 0.2 * (k - 1)).toFixed(2);
      el.addEventListener('click', e => { e.stopPropagation(); showInLightbox(real[idx]); });
      sideBox.appendChild(el);
    }
  });
}
lightbox.addEventListener('click', closeLightbox);

// 每一帧：算出每张照片在屏幕上的位置、大小，以及它此刻是"礼物盒"还是"雪花"
function updatePhotos(vp) {
  const spread = 1 - form;
  const cw = canvas.clientWidth, ch = canvas.clientHeight, pxPerUnit = ch / (2 * Math.tan(FOV / 2));
  const c = Math.cos(spin), s = Math.sin(spin);
  for (let i = 0; i < photos.length; i++) {
    const ph = photos[i];
    if (!ph.el) continue;                                              // 这张照片还在添加中，元素还没生成
    const st = ph.el.style;
    const e = smooth(0, 1, spread * 1.5 - (i % 6) / 6 * 0.5);          // 0 = 挂在树上，1 = 飘在空中；一张接一张地变
    const a0 = i * 2.39996, f1 = (i * 0.618034) % 1, f2 = (i * 0.37) % 1;
    // 树上的位置：挂在枝梢下面，跟着树一起转
    const hy = photoHomeY(i), hr = coneR(hy) * 0.93, hx0 = Math.cos(a0) * hr, hz0 = Math.sin(a0) * hr;
    const hx = c * hx0 + s * hz0, hz = -s * hx0 + c * hz0;
    // 空中的位置：围着树慢慢转，上下轻轻浮动
    const a = a0 + time * 0.03, rr = 6.5 + f2 * 4, sy = 1.8 + f1 * 7.2 + Math.sin(time * 0.5 + i * 1.3) * 0.35;
    const x = hx + (Math.cos(a) * rr - hx) * e, y = hy + (sy - hy) * e, z = hz + (Math.sin(a) * rr - hz) * e;
    const X = vp[0] * x + vp[4] * y + vp[8] * z + vp[12], Y = vp[1] * x + vp[5] * y + vp[9] * z + vp[13], Wc = vp[3] * x + vp[7] * y + vp[11] * z + vp[15];
    ph.depth = Wc; ph.e = e;
    if (Wc < 2) { st.opacity = 0; ph.disc.style.pointerEvents = ph.flake.style.pointerEvents = 'none'; continue; }
    const px = (X / Wc * 0.5 + 0.5) * cw, py = (1 - (Y / Wc * 0.5 + 0.5)) * ch;
    const back = smooth(camDist - 0.4, camDist + 1.6, Wc) * (1 - e);   // 转到树背面的礼物盒：点不到
    const pendantScale = Math.min(3, PHOTO_GIFT * pxPerUnit / Wc / 46);   // 点击区和礼物盒一样大
    const flakeScale = 0.7 + 9 / Wc;                                   // 雪花：近处的稍大一点
    const sc = pendantScale + (flakeScale - pendantScale) * e;
    const rot = time * 16 * (i % 2 ? 1 : -1) * e;                       // 雪花慢慢转
    const twinkle = 1 - e * (0.22 + 0.22 * Math.sin(time * 2.3 + i * 4.1));
    st.transform = 'translate(' + px.toFixed(1) + 'px,' + py.toFixed(1) + 'px) rotate(' + rot.toFixed(2) + 'deg) scale(' + sc.toFixed(3) + ')';
    st.opacity = ((1 - 0.8 * back) * (1 - 0.4 * e * smooth(camDist - 2, camDist + 9, Wc)) * twinkle).toFixed(3);
    st.zIndex = (2000 - Wc * 20) | 0;
    st.setProperty('--e', e.toFixed(3));
    ph.disc.style.pointerEvents = e < 0.3 && back < 0.5 ? 'auto' : 'none';
    ph.flake.style.pointerEvents = e > 0.7 ? 'auto' : 'none';
  }
}

// 启动时：读出配置里的照片和以前添加的照片

/* ============================ 摄像头手势 ============================ */
// 用 Google 的 MediaPipe 识别手势（和你之前试过的那个项目是同一套做法）。
// 摄像头画面只在这台电脑上处理，不会发到任何地方；识别库和模型第一次使用时需要联网下载。
const GESTURE_LIB = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const GESTURE_MODEL = 'https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task';
const camEl = document.getElementById('cam'), gestureBtn = document.getElementById('gestureBtn');
const G = { on: false, busy: false, rec: null, stream: null, timer: 0, name: '', count: 0, yawRate: 0, pitchTarget: null, lb: false };

async function loadRecognizer() {
  if (G.rec) return G.rec;
  const vision = await import(GESTURE_LIB + '/vision_bundle.mjs');
  const files = await vision.FilesetResolver.forVisionTasks(GESTURE_LIB + '/wasm');
  const opts = delegate => ({ baseOptions: { modelAssetPath: GESTURE_MODEL, delegate }, runningMode: 'VIDEO', numHands: 1 });
  try { G.rec = await vision.GestureRecognizer.createFromOptions(files, opts('GPU')); }
  catch (e) { G.rec = await vision.GestureRecognizer.createFromOptions(files, opts('CPU')); }
  return G.rec;
}
function stopGesture() {
  clearInterval(G.timer);
  if (G.stream) G.stream.getTracks().forEach(t => t.stop());
  G.stream = null; G.on = false; G.yawRate = 0; G.pitchTarget = null; G.name = ''; G.count = 0;
  camEl.srcObject = null; camEl.classList.remove('on');
  gestureBtn.textContent = '手势';
}
async function startGesture() {
  if (G.busy) return;
  G.busy = true; gestureBtn.textContent = '手势 …';
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw Object.assign(new Error('no camera api'), { name: 'NoCameraApi' });
    showHint('请在浏览器弹出的提示里允许使用摄像头（画面只在本机处理）');
    G.stream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 480 }, height: { ideal: 360 }, facingMode: 'user' }, audio: false });
    camEl.srcObject = G.stream; await camEl.play(); camEl.classList.add('on');
    showHint('正在加载手势识别，第一次需要联网下载约 18MB…');
    await loadRecognizer();
    G.on = true; gestureBtn.textContent = '手势 开';
    G.timer = setInterval(gestureTick, 70);
    showHint('张开手掌 散开 · 握拳 聚合 · 左右移动手 旋转 · 伸出食指 看照片', 14000);
  } catch (e) {
    stopGesture();
    const why = e && (e.name === 'NotAllowedError' || e.name === 'SecurityError') ? '没有拿到摄像头权限，请在浏览器地址栏里允许后再试'
              : e && (e.name === 'NotFoundError' || e.name === 'NoCameraApi') ? '没有找到可用的摄像头'
              : '手势识别加载失败，请检查网络后再试';
    showHint(why, 8000);
  }
  G.busy = false;
}
gestureBtn.addEventListener('click', () => { if (G.on) { stopGesture(); showHint('手势已关闭', 2500); } else startGesture(); });

function gestureTick() {
  if (!G.on || camEl.readyState < 2 || !camEl.videoWidth) return;
  let res;
  try { res = G.rec.recognizeForVideo(camEl, performance.now()); } catch (e) { return; }
  const g = res.gestures && res.gestures[0] && res.gestures[0][0], lm = res.landmarks && res.landmarks[0];
  if (!g || !lm) { G.yawRate = 0; G.pitchTarget = null; G.name = ''; G.count = 0; return; }   // 画面里没有手
  const name = g.score > 0.5 ? g.categoryName : 'None';
  G.count = name === G.name ? G.count + 1 : 1; G.name = name;

  // 手在画面里偏左 / 偏右 → 树往那边转；张开手掌时，手的高低控制俯视角度
  const off = 0.5 - lm[9].x;
  G.yawRate = name === 'Closed_Fist' || !lightbox.hidden ? 0 : -Math.sign(off) * Math.max(0, Math.abs(off) - 0.1) * 2.2;
  G.pitchTarget = name === 'Open_Palm' ? Math.min(0.9, Math.max(0.08, 0.95 - lm[9].y)) : null;

  if (G.lb && name !== 'Pointing_Up' && G.count === 4) closeLightbox();        // 收回食指，照片放回去
  if (G.count !== 3) return;                                                   // 同一个手势连续认出 3 次才算数，避免误触
  if (name === 'Open_Palm' && formTarget > 0.5 && form >= 1) toggleForm();
  else if (name === 'Closed_Fist') { closeLightbox(); if (formTarget < 0.5) toggleForm(); }
  else if (name === 'Pointing_Up' && (form >= 1 || form <= 0) && lightbox.hidden) {
    // 伸出食指：把离镜头最近的那张照片放大
    let best = -1;
    photos.forEach((p, i) => { if (!p.placeholder && p.depth > 2 && (best < 0 || p.depth < photos[best].depth)) best = i; });
    if (best >= 0) { const p = photos[best]; openLightbox(best, (p.e > 0.5 ? p.flake : p.disc).getBoundingClientRect()); G.lb = true; }
  }
}

/* ============================ 每一帧 ============================ */
const maxPoint = gl.getParameter(gl.ALIASED_POINT_SIZE_RANGE)[1];
const TARGET = [0, 4.7, 0];
let last = performance.now(), time = 0, spin = 0;
let cometQ = 0, pulseAt = -100;

const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

function drawQuad(prog, target, w, h) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, target);
  gl.viewport(0, 0, w, h);
  gl.useProgram(prog.p);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

function frame(now) {
  requestAnimationFrame(frame);                                        // 先预约下一帧：即使这一帧出了错，动画也不会停
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now; time += dt; spin += dt * CONFIG.spinSpeed;
  resize();

  // 聚合进度、松手后的惯性、鼠标"吹气"的余波
  const step = dt / 3.2;
  form = formTarget > form ? Math.min(formTarget, form + step) : Math.max(formTarget, form - step);
  if (!pointers.size) {
    yaw += vYaw + G.yawRate * dt; pitch += vPitch; vYaw *= 0.93; vPitch *= 0.86;
    if (G.pitchTarget !== null) pitch += (G.pitchTarget - pitch) * Math.min(1, dt * 2);
  }
  pitch = Math.min(1.05, Math.max(0.04, pitch));
  dist = Math.min(48, Math.max(10, dist));
  pointerLive *= Math.exp(-dt * 1.5);

  // 彗星：树完全成形后，一团金色的光沿着丝带爬上去；到顶时触发一次"心跳"
  let cometOn = 0;
  if (form >= 1) {
    cometQ += dt * CONFIG.cometSpeed;
    if (cometQ >= 1) { cometQ -= 1; pulseAt = time; chime(2093, 0.28); }
    cometOn = smooth(0, 0.03, cometQ) * (1 - smooth(0.97, 1, cometQ));
  } else cometQ = 0;
  const ct = 1 - Math.sqrt(1 - cometQ);
  const ca = TURNS * TAU * Math.pow(ct, 0.8), cr = R * Math.pow(1 - ct, 1.12) * 1.08 + 0.3;
  const hx = Math.cos(ca) * cr, hz = Math.sin(ca) * cr, cs = Math.cos(spin), sn = Math.sin(spin);
  const comet = [cs * hx + sn * hz, H * ct, -sn * hx + cs * hz];
  const pulseAge = time - pulseAt;

  // 金光经过哪盏灯，就敲响哪盏灯
  if (cometOn > 0.5) for (const l of lights) {
    const w = lightWorld(l), ddx = w[0] - comet[0], ddy = w[1] - comet[1], ddz = w[2] - comet[2];
    if (ddx * ddx + ddy * ddy + ddz * ddz < 0.72 && time - l.heard > 3) { l.heard = time; ringLight(l, 0.5); }
  }

  // 相机：围着树转
  const aspect = W / HH;
  const dd = dist * Math.max(1, 0.62 / aspect);            // 竖屏时自动拉远，保证整棵树都在画面里
  const cp = Math.cos(pitch);
  const eye = [TARGET[0] + dd * cp * Math.sin(yaw), TARGET[1] + dd * Math.sin(pitch), TARGET[2] + dd * cp * Math.cos(yaw)];
  const view = lookAt(eye, TARGET), proj = perspective(FOV, aspect, 0.1, 250);
  const vp = matmul(proj, view);
  camVP = vp; camEye = eye; camDist = dd;
  updatePhotos(vp);

  // 1) 把所有粒子画进高动态范围画布（先画倒影，再画本体）
  gl.bindFramebuffer(gl.FRAMEBUFFER, scene.fbo);
  gl.viewport(0, 0, W, HH);
  gl.depthMask(true);
  gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  const gloss = form * form * (1 - 0.85 * smooth(0.2, 0.75, pitch));   // 俯视时倒影变淡；化雪时没有倒影

  // 1a) 实体的枝叶和装饰：不透明，前面的挡住后面的
  gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL); gl.disable(gl.BLEND);
  if (form > 0.004) {
    gl.useProgram(progCards.p);
    const k = progCards.u;
    gl.uniformMatrix4fv(k.uVP, false, vp);
    gl.uniformMatrix4fv(k.uView, false, view);
    gl.uniform2f(k.uProj, proj[0], proj[5]);
    gl.uniform4f(k.uComet, comet[0], comet[1], comet[2], cometOn);
    gl.uniform3fv(k.uGold, C.gold);
    gl.uniform1f(k.uTime, time);
    gl.uniform1f(k.uForm, form);
    gl.uniform1f(k.uSpin, spin);
    gl.uniform1f(k.uGain, hdr ? 1 : 0.3);
    gl.activeTexture(gl.TEXTURE4); gl.bindTexture(gl.TEXTURE_2D, atlasTex); gl.uniform1i(k.uAtlas, 4);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindVertexArray(cardVao);
    if (gloss > 0.01) { gl.uniform1f(k.uMirror, gloss); gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, CARD_COUNT); }
    gl.uniform1f(k.uMirror, 0); gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, CARD_COUNT);
  }

  // 1b) 发光的粒子（彩带、小灯、雪、涟漪…）：叠加在上面，但会被前面的枝叶挡住
  gl.depthMask(false);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
  gl.useProgram(progPoints.p);
  const u = progPoints.u;
  gl.uniformMatrix4fv(u.uVP, false, vp);
  gl.uniform4f(u.uComet, comet[0], comet[1], comet[2], cometOn);
  gl.uniform3f(u.uPointer, pointerX, pointerY, pointerLive);
  gl.uniform3fv(u.uGold, C.gold);
  gl.uniform1f(u.uTime, time);
  gl.uniform1f(u.uForm, form);
  gl.uniform1f(u.uSpin, spin);
  gl.uniform1f(u.uCometQ, cometQ);
  gl.uniform1f(u.uPulseAge, pulseAge);
  gl.uniform1f(u.uAspect, aspect);
  gl.uniform1f(u.uDist, dd);
  gl.uniform1f(u.uBand, CONFIG.bandWidth);
  gl.uniform1f(u.uPx, HH / (2 * Math.tan(FOV / 2)));
  gl.uniform1f(u.uGain, hdr ? 1 : 0.3);
  gl.uniform1f(u.uMaxPt, Math.min(maxPoint, 34 * dpr));
  gl.bindVertexArray(vao);
  if (gloss > 0.01) { gl.uniform1f(u.uMirror, gloss); gl.drawArrays(gl.POINTS, 0, TREE_COUNT); }
  gl.uniform1f(u.uMirror, 0); gl.drawArrays(gl.POINTS, 0, COUNT);

  // 灯（同样先画倒影，再画本体）
  const nl = Math.min(lights.length, MAX_LIGHTS);
  if (nl && form > 0.85) {
    for (let i = 0; i < nl; i++) {
      const l = lights[i], o = i * STRIDE;
      lightData[o] = l.x; lightData[o + 1] = l.y; lightData[o + 2] = l.z;
      lightData[o + 6] = l.col[0]; lightData[o + 7] = l.col[1]; lightData[o + 8] = l.col[2];
      lightData[o + 9] = l.size; lightData[o + 10] = l.ph; lightData[o + 11] = 7; lightData[o + 12] = l.ring;
    }
    gl.bindVertexArray(lightVao);
    gl.bindBuffer(gl.ARRAY_BUFFER, lightBuf);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, lightData.subarray(0, nl * STRIDE));
    if (gloss > 0.01) { gl.uniform1f(u.uMirror, gloss); gl.drawArrays(gl.POINTS, 0, nl); }
    gl.uniform1f(u.uMirror, 0); gl.drawArrays(gl.POINTS, 0, nl);
  }

  // 留言跟着它的灯走
  if (msgLight) {
    if (time > msgUntil || form < 1) { msgEl.classList.remove('on'); msgLight = null; }
    else {
      const w = lightWorld(msgLight), pr = project(vp, w[0], w[1], w[2]);
      msgEl.style.transform = 'translate(' + (pr[0] * canvas.clientWidth).toFixed(1) + 'px,' + ((1 - pr[1]) * canvas.clientHeight).toFixed(1) + 'px) translate(-50%, -190%)';
    }
  }

  // 2) 逐级缩小并模糊，得到三层光晕
  gl.disable(gl.BLEND); gl.disable(gl.DEPTH_TEST);
  gl.bindVertexArray(emptyVao);
  gl.useProgram(progBlur.p);
  gl.activeTexture(gl.TEXTURE0);
  gl.uniform1i(progBlur.u.uTex, 0);
  let src = scene.tex;
  for (const l of levels) {
    gl.bindTexture(gl.TEXTURE_2D, src);
    gl.uniform2f(progBlur.u.uDir, 0, 0);
    drawQuad(progBlur, l.a.fbo, l.a.w, l.a.h);
    gl.bindTexture(gl.TEXTURE_2D, l.a.tex);
    gl.uniform2f(progBlur.u.uDir, 1 / l.a.w, 0);
    drawQuad(progBlur, l.b.fbo, l.b.w, l.b.h);
    gl.bindTexture(gl.TEXTURE_2D, l.b.tex);
    gl.uniform2f(progBlur.u.uDir, 0, 1 / l.a.h);
    drawQuad(progBlur, l.a.fbo, l.a.w, l.a.h);
    src = l.a.tex;
  }

  // 3) 合成到屏幕
  const star = project(vp, 0, STAR_Y, 0), cm = project(vp, comet[0], comet[1], comet[2]);
  const formed = smooth(0.75, 1, form);
  gl.useProgram(progFinal.p);
  const f = progFinal.u;
  [scene.tex, levels[0].a.tex, levels[1].a.tex, levels[2].a.tex].forEach((t, i) => {
    gl.activeTexture(gl.TEXTURE0 + i); gl.bindTexture(gl.TEXTURE_2D, t);
  });
  gl.uniform1i(f.uScene, 0); gl.uniform1i(f.uB1, 1); gl.uniform1i(f.uB2, 2); gl.uniform1i(f.uB3, 3);
  gl.uniform3f(f.uStar, star[0], star[1], star[2] * formed * (0.55 + 0.1 * Math.sin(time * 2.1) + 2.2 * Math.exp(-pulseAge * 1.3)));
  gl.uniform3f(f.uCometS, cm[0], cm[1], cm[2] * cometOn);
  gl.uniform3fv(f.uGold, C.gold);
  gl.uniform1f(f.uAspect, aspect);
  gl.uniform1f(f.uExposure, CONFIG.exposure * (hdr ? 1 : 1 / 0.3));
  gl.uniform1f(f.uTime, time);
  drawQuad(progFinal, null, W, HH);
}

resize();
requestAnimationFrame(frame);
// 开场：先是一场雪，然后雪聚成树
setTimeout(toggleForm, 1600);
</script>
